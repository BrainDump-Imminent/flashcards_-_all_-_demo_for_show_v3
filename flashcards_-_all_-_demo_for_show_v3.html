<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Psychology — Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-display: 'Instrument Serif', serif;
  --font-body:    'Manrope', sans-serif;
  --font-mono:    'DM Mono', monospace;
  --text: #1a1828;
  --text2: #555;
  --text3: #888;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; font-family: var(--font-body); background: #f9f9f7; color: var(--text);
}

#flashcards-view {
  display: flex; flex-direction: column; min-height: 100vh; overflow-y: auto;
  background: #f9f9f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Deck chooser */
#fc-home {
  max-width: 860px; margin: 0 auto; padding: 24px 28px; width: 100%;
}
.fc-home-header {
  text-align: center; margin-bottom: 24px;
}
.fc-home-title {
  font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; color: #1a1828; margin-bottom: 4px;
}
.fc-home-sub { font-size: 1.05rem; color: #888; }
.fc-unit-section { margin-bottom: 22px; }
.fc-unit-label {
  font-size: 0.92rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: #9490a8; font-family: var(--font-mono); margin-bottom: 10px;
  padding-bottom: 5px; border-bottom: 1px solid #e8e7e0;
}
.fc-deck-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.fc-deck-btn {
  background: #fff; border: 1.5px solid #e0dfe8; border-radius: 10px;
  padding: 12px 16px; cursor: pointer; text-align: left;
  transition: border-color .18s, box-shadow .18s; min-width: 180px; max-width: 220px; flex: 1;
}
.fc-deck-btn:hover { box-shadow: 0 3px 12px rgba(83,74,183,.12); }
.fc-deck-tag {
  display: inline-block; font-size: 0.9rem; font-weight: 700; padding: 2px 8px;
  border-radius: 20px; margin-bottom: 6px; font-family: var(--font-mono);
}
.fc-deck-name { font-weight: 700; font-size: 1.06rem; color: #1a1828; margin-bottom: 2px; line-height: 1.3; }
.fc-deck-count { font-size: 0.98rem; color: #888; }

/* Study area */
#fc-study {
  display: none; flex-direction: column; flex: 1; max-width: 860px; margin: 0 auto; width: 100%; padding: 16px 28px;
}
#fc-study.active { display: flex; }

/* Mode tabs */
#fc-nav {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 1px solid #e8e7e0; flex-wrap: wrap;
}
#fc-deck-title { flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: #1a1828; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-mode-tabs { display: flex; gap: 4px; background: #f1f0e8; padding: 3px; border-radius: 9px; }
.fc-mode-btn {
  padding: 5px 12px; font-size: 0.98rem; font-weight: 600; border-radius: 6px; border: none;
  background: transparent; cursor: pointer; color: #888; transition: all .15s;
}
.fc-mode-btn.active { background: #fff; color: #1a1828; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.fc-back-btn {
  padding: 5px 11px; font-size: 0.98rem; border-radius: 7px; border: 1px solid #d0cfd6;
  background: #fff; cursor: pointer; color: #666; font-weight: 600;
}
.fc-back-btn:hover { background: #f1f0e8; }

/* Browse */
#fc-browse .fc-search-wrap { position: relative; margin-bottom: 10px; }
#fc-browse .fc-search-wrap input {
  width: 100%; padding: 9px 14px 9px 36px; font-size: 1.08rem; border: 1px solid #d8d7ce;
  border-radius: 9px; background: #fff; outline: none; color: #1a1828;
}
#fc-browse .fc-search-wrap input:focus { border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,.1); }
.fc-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; pointer-events: none; }
.fc-count-badge {
  display: inline-block; background: #EEEDFE; color: #534AB7; font-size: 0.98rem;
  font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
  font-family: var(--font-mono);
}
.fc-term-row {
  display: flex; flex-direction: column; gap: 2px; padding: 14px 16px;
  border: 1px solid #e8e7e0; border-radius: 9px; font-size: 1.06rem;
  background: #fff; margin-bottom: 5px;
}
.fc-term-row:hover { border-color: #c0bfb6; }
.fc-term-word { font-weight: 700; color: #1a1828; font-size: 1.1rem; }
.fc-term-def { color: #555; line-height: 1.55; }

/* Flashcard Learn */
#fc-learn { display: none; }
#fc-learn.active { display: block; max-width: 560px; margin: 0 auto; }
.fc-progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.fc-prog-track { flex: 1; height: 5px; background: #e8e7e0; border-radius: 5px; overflow: hidden; }
.fc-prog-bar { height: 5px; border-radius: 5px; transition: width .4s ease; }
.fc-prog-label { font-size: 1.02rem; color: #888; white-space: nowrap; font-weight: 600; font-family: var(--font-mono); }
.fc-card-wrap {
  perspective: 1200px; height: 220px; cursor: pointer; margin-bottom: 10px;
}
.fc-card-inner {
  position: relative; width: 100%; height: 100%;
  transition: transform .5s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d;
}
.fc-card-wrap.flipped .fc-card-inner { transform: rotateY(180deg); }
.fc-card-face {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
  border: 1px solid #e0dfe8; border-radius: 14px; background: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 1.5rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.fc-card-back-face { transform: rotateY(180deg); background: #f8f7ff; border-color: #c8c5ef; }
.fc-card-label {
  font-size: 0.95rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: #aaa; margin-bottom: 12px; font-family: var(--font-mono);
}
.fc-card-term { font-size: 1.1rem; font-weight: 700; color: #1a1828; line-height: 1.5; }
.fc-card-def { font-size: 1.08rem; color: #444; line-height: 1.65; font-weight: 400; }
.fc-flip-hint { text-align: center; font-size: 0.97rem; color: #ccc; margin-bottom: 14px; }
.fc-learn-btns { display: flex; gap: 12px; justify-content: center; }
.fc-learn-btn {
  padding: 10px 24px; border-radius: 9px; font-size: 1.06rem; font-weight: 700;
  cursor: pointer; border: none; transition: all .15s;
}
.fc-btn-got { background: #E1F5EE; color: #0F6E56; }
.fc-btn-got:hover { background: #c8efdf; }
.fc-btn-miss { background: #FAECE7; color: #993C1D; }
.fc-btn-miss:hover { background: #f5d4c8; }

/* Round result */
#fc-result { display: none; text-align: center; padding: 1.5rem; }
#fc-result.active { display: block; }
.fc-result-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; margin-bottom: 12px; }
.fc-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
.fc-stat { background: #f1f0e8; border-radius: 9px; padding: 10px 20px; text-align: center; }
.fc-stat .sn { font-size: 1.4rem; font-weight: 800; }
.fc-stat .sl { font-size: 0.97rem; color: #888; margin-top: 2px; }
.fc-stat.good .sn { color: #0F6E56; }
.fc-stat.miss .sn { color: #993C1D; }
.fc-result-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.fc-r-btn { padding: 9px 20px; border-radius: 8px; font-size: 1.06rem; font-weight: 700; cursor: pointer; border: 1.5px solid #d0cfd6; background: #fff; color: #1a1828; transition: all .15s; }
.fc-r-btn:hover { background: #f1f0e8; }
.fc-r-btn.primary { background: #534AB7; border-color: #534AB7; color: #fff; }
.fc-r-btn.primary:hover { background: #3C3489; }

/* Match game */
#fc-match { display: none; }
#fc-match.active { display: block; }
.fc-match-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
.fc-match-timer { font-size: 1.3rem; font-weight: 800; color: #534AB7; font-family: var(--font-mono); }
.fc-match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media(max-width:600px){.fc-match-grid{grid-template-columns:repeat(2,1fr)}}
.fc-match-card {
  padding: 10px 8px; border: 1.5px solid #d8d7ce; border-radius: 10px;
  background: #fff; cursor: pointer; font-size: 0.98rem; text-align: center;
  line-height: 1.4; min-height: 64px; display: flex; align-items: center; justify-content: center;
  transition: all .15s; user-select: none; font-weight: 600; color: #333;
}
.fc-match-card:hover { border-color: #534AB7; background: #f8f7ff; }
.fc-match-card.sel { border-color: #534AB7; background: #EEEDFE; color: #3C3489; box-shadow: 0 0 0 3px rgba(83,74,183,.15); }
.fc-match-card.matched { border-color: #15803d; background: #bbf7d0; color: #052e16; pointer-events: none; box-shadow: 0 0 0 3px rgba(22,163,74,.3); transition: all .3s; }
.fc-match-card.wrong { border-color: #b91c1c; background: #fecaca; color: #7f1d1d; box-shadow: 0 0 0 3px rgba(220,38,38,.25); animation: fcShake .3s ease; }
@keyframes fcShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fc-match-done { background: #E1F5EE; border: 1px solid #9FE1CB; border-radius: 12px; padding: 1.5rem; text-align: center; margin-top: 12px; }
.fc-match-done h3 { font-size: 1.1rem; font-weight: 800; color: #0F6E56; margin-bottom: 6px; }
.fc-match-done p { color: #0F6E56; font-size: 1.06rem; margin-bottom: 10px; }

/* MCQ */
#fc-mcq { display: none; }
#fc-mcq.active { display: block; max-width: 580px; margin: 0 auto; }
.fc-mcq-q {
  font-size: 1.05rem; font-weight: 700; background: #fff; border: 2px solid #e0dfe8;
  border-radius: 14px; padding: 1.5rem; text-align: center; margin: 14px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); line-height: 1.5; color: #1a1828;
}
.fc-mcq-opts { display: flex; flex-direction: column; gap: 7px; }
.fc-mcq-opt {
  padding: 12px 16px; border: 1.5px solid #d8d7ce; border-radius: 9px; background: #fff;
  cursor: pointer; font-size: 1.06rem; text-align: left; line-height: 1.5; transition: all .15s;
  font-weight: 500; color: #333;
}
.fc-mcq-opt:hover { border-color: #534AB7; background: #f8f7ff; }
.fc-mcq-opt.correct { border-color: #15803d; background: #bbf7d0; color: #052e16; pointer-events: none; box-shadow: 0 0 0 3px rgba(22,163,74,.3); }
.fc-mcq-opt.wrong { border-color: #b91c1c; background: #fecaca; color: #7f1d1d; pointer-events: none; }
.fc-mcq-opt.show-ans { border-color: #15803d; background: #bbf7d0; color: #052e16; }
.fc-mcq-opt.disabled { pointer-events: none; opacity: .35; }
.fc-mcq-score { text-align: center; font-size: 1.02rem; color: #888; margin-bottom: 10px; font-family: var(--font-mono); font-weight: 700; }
</style>
</head>
<body>

<div id="flashcards-view"></div>

<script>
// ── Stubs for app integration points ──────────────
function tmrSetContext() {}  // timer context stub
const currentView = 'flashcards';  // always in flashcard view
const UNITS_DATA = [];  // not needed standalone
function isTopicDone() { return false; }
function crvRecordReview() {}

// ── FLASHCARD UTILITY HELPERS ─────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }
</script>

<script>
const FC_DECKS = {

  // ── UNIT 0: Research Methods ───────────────────────
  u0: {
    label:'Unit 0 — Research Methods', tag:'Unit 0', color:'#9490a8',
    cards:[
      {t:'Scientific Attitude', d:'Curiosity + Skepticism + Humility — the mindset that drives good psychological research.', e:'A researcher doubts a viral study about "brain training" and designs a replication to check if the effect holds.'},
      {t:'Hypothesis', d:'A specific, testable, and falsifiable prediction about the relationship between two or more variables.', e:'Students who sleep 8+ hours will score higher on tomorrow\'s quiz than students who sleep fewer than 6 hours.'},
      {t:'Independent Variable (IV)', d:'What the researcher manipulates — the cause in an experiment.', e:'In a caffeine study, the IV is the amount of caffeine given (0 mg vs. 200 mg).'},
      {t:'Dependent Variable (DV)', d:'What is measured — the effect in an experiment.', e:'In the caffeine study, the DV is the participants\' reaction time measured in milliseconds.'},
      {t:'Confounding Variable', d:'An extraneous factor that could influence the DV alongside the IV.', e:'In a study linking ice cream sales to drowning rates, hot weather is the confound causing both.'},
      {t:'Equal-Chance Participant Grouping', d:'Randomly assigning people into experimental or control conditions so pre-existing differences are evenly spread.', e:'Flipping a coin to assign each person to the therapy group or the control group.'},
      {t:'Random Selection / Sampling', d:'Each individual in a population has an equal chance of being chosen — ensures a representative subset of participants.', e:'Using a lottery-style generator to select 200 students from a school roster of 2,000.'},
      {t:'Operational Definition', d:'A precise, measurable description of how a variable is specified and quantified in a specific study.', e:'Defining "anxiety" as a score ≥ 15 on the GAD-7 questionnaire.'},
      {t:'Replication', d:'Repeating a study with different participants to verify findings.', e:'Attempting to reproduce Milgram\'s obedience study at a different university to see if results hold.'},
      {t:'Case Study', d:'An in-depth analysis of one individual or group; provides rich detail but poor generalizability.', e:'Phineas Gage — the railroad worker whose personality changed after an iron rod pierced his frontal lobe — was examined in extraordinary depth by researchers.'},
      {t:'Naturalistic Observation', d:'Watching behavior unfold in real-world settings without interference; high external validity.', e:'Researchers sit in a park and record how often children share toys without intervening.'},
      {t:'Survey Method', d:'Self-reported data from a sample; must be representative to generalize; subject to social desirability bias.', e:'1,000 randomly selected Americans are polled about their social media use and reported loneliness.'},
      {t:'Correlational Study', d:'Measures the relationship between variables; CANNOT establish causation.', e:'Students who take notes by hand have higher exam scores — but this doesn\'t prove note-taking style causes the difference.'},
      {t:'Correlation Coefficient (r)', d:'Ranges from -1.00 to +1.00; indicates strength and direction of a relationship.', e:'r = +0.85 between hours studied and test score; r = –0.72 between absences and GPA.'},
      {t:'Third Variable Problem', d:'An unseen factor may be causing both correlated outcomes — correlation ≠ causation.', e:'Shoe size and reading ability correlate in children — but age causes both, not each other.'},
      {t:'Experiment', d:'The ONLY method that can establish cause-and-effect; uses random assignment and a control group.', e:'Randomly assigning half the class to study with background music and half without, then comparing quiz scores.'},
      {t:'Control Group', d:'The condition not exposed to the IV — used as a baseline for comparison.', e:'In a drug trial, one condition receives a sugar pill (no active treatment) while the experimental condition gets the real medication.'},
      {t:'Placebo Effect', d:'Improvement due to belief in treatment, not the treatment itself.', e:'Patients report less pain after receiving a saline injection they believed was morphine.'},
      {t:'Double-Blind Procedure', d:'Neither participants nor researchers know who is in which group — eliminates both placebo effect and experimenter bias.', e:'In a drug trial, neither the patients nor the nurses distributing pills know who is receiving the real drug.'},
      {t:'Experimenter Bias', d:'Researchers\' expectations unconsciously influence study results.', e:'A researcher who believes the treatment works inadvertently gives enthusiastic cues to treatment-group participants.'},
      {t:'Sampling Bias', d:'The chosen subset of participants does not accurately represent the population — limits generalizability.', e:'Polling only smartphone users about technology habits misses people who don\'t own smartphones.'},
      {t:'Hindsight Bias', d:'"I-knew-it-all-along" phenomenon — tendency to believe outcomes were predictable after they occur.', e:'After a sports upset, fans say "I knew the underdog would win" — even though they had not predicted it beforehand.'},
      {t:'Overconfidence', d:'We tend to think we know more than we do; our certainty exceeds our accuracy.', e:'Students estimate they\'ll score 90% on a test but average 72%.'},
      {t:'Meta-Analysis', d:'Statistical technique combining data from many studies on the same topic for a more reliable conclusion.', e:'A researcher combines 50 studies on CBT for depression to calculate the overall effect size.'},
      {t:'Informed Consent', d:'Participants must understand risks before agreeing to participate.', e:'Participants sign a form explaining potential risks of a stress-induction experiment before it begins.'},
      {t:'Debriefing', d:'Explaining the true purpose of a study to participants after it ends.', e:'After a deception study on helping behavior, the researcher explains the true purpose and ensures no lasting distress.'},
      {t:'Mean', d:'Arithmetic average: sum of scores ÷ number of scores.', e:'Scores: 70, 80, 90 → Average = (70+80+90)/3 = 80.'},
      {t:'Median', d:'The midpoint of a distribution — less affected by extreme scores than the mean.', e:'Scores: 20, 70, 75, 80, 85 → Middle value = 75 (unaffected by the outlier 20).'},
      {t:'Mode', d:'The most frequently occurring score in a distribution.', e:'Scores: 72, 85, 85, 90, 95 → Most frequent value = 85 (appears most often).'},
      {t:'Standard Deviation', d:'Measures how much scores vary around the mean — larger SD = more spread out.', e:'A class with scores 79, 80, 81 has a small SD; a class with 50, 80, 110 has a large SD.'},
      {t:'Normal Distribution', d:'Bell-shaped curve; ~68% within 1 SD, ~95% within 2 SDs of the mean.', e:'Heights of adults form a bell curve — most cluster near the average, fewer are very short or very tall.'},
      {t:'Statistical Significance', d:'Result unlikely to be due to chance (p < .05 convention); does NOT mean practically important.', e:'A new drug lowers blood pressure by 3 mmHg with p < .05 — unlikely due to chance, but may not be clinically meaningful.'},
      {t:'Effect Size', d:'The magnitude of the difference or relationship — measures practical importance.', e:'Two groups differ by 2 points on a 100-point scale: statistically significant but the practical magnitude is tiny (d = 0.1).'},
      {t:'Signal Detection Theory', d:'The study of our ability to identify a faint stimulus amid background noise; separates sensitivity from response bias — used to study perception and decision-making.', e:'A radiologist must decide whether a faint shadow on an X-ray is a tumor or noise — their decision depends on sensitivity and willingness to say "yes."'},
      {t:'Weber\'s Smallest Perceivable Contrast (JND)', d:'The minimum difference between two stimuli detected 50% of the time. Also called the difference threshold — governed by Weber\'s Law.', e:'You can tell the difference between 50 and 51 lbs, but not between 50 and 50.5 lbs — the JND for weight is about 1/50 of the original.'},
    ]
  },

  // ── UNIT 1: Biological Bases of Behavior ───────────
  u1: {
    label:'Unit 1 — Biological Bases', tag:'Unit 1', color:'#22D3EE',
    cards:[
      {t:'Nature vs. Nurture', d:'The debate over whether genetics or environment shapes behavior. Today: BOTH interact.', e:'Identical twins raised apart still share many personality traits (genetics), but adoption into a stimulating home raises IQ scores (environment).'},
      {t:'Evolutionary Perspective', d:'Uses natural selection to explain behavior tendencies that enhanced our ancestors\' survival and reproduction.', e:'Humans\' fear of snakes may have evolved because those creatures were deadly to our ancestors.'},
      {t:'Natural Selection', d:'Inherited traits enabling organisms to survive and reproduce are passed on; others die out.', e:'Peppered moths that matched tree bark color survived better and passed that trait to offspring.'},
      {t:'Eugenics', d:'The discredited and unethical practice of attempting to improve the human gene pool through selective reproduction.', e:'Programs that tried to control human reproduction based on perceived "fitness" were later universally condemned as pseudoscience and deeply unethical.'},
      {t:'Behavior Genetics', d:'Studies the relative power of hereditary and environmental influences on how we act and think.', e:'Researchers find that identical twins have more similar IQs than fraternal twins, suggesting genetic influence.'},
      {t:'Identical vs. Fraternal Sibling Comparison Research', d:'Twin study method comparing monozygotic pairs (100% shared DNA) with dizygotic pairs (~50%) to disentangle genetic vs. environmental influences.', e:'Monozygotic twins raised apart show similar levels of extraversion — suggesting a genetic basis for personality.'},
      {t:'Identical (Monozygotic) Twins', d:'Develop from a single fertilized egg; share 100% of genes — used to study pure genetic influence.', e:'Jim Lewis and Jim Springer — same-egg siblings separated at birth — both had dogs named Toy and married women named Linda.'},
      {t:'Fraternal (Dizygotic) Twins', d:'Develop from two separate eggs; share ~50% genes — genetically no closer than siblings.', e:'Two-egg siblings may look completely different and have different blood types, just like any two non-twin siblings.'},
      {t:'Adoption Studies', d:'Compare children raised by non-biological caregivers to their birth parents and their new-family parents to untangle heredity from environment.', e:'Adopted children\'s IQ scores correlate more with biological parents than adoptive parents, suggesting genetic influence on intelligence.'},
      {t:'Epigenetics', d:'Study of how environmental factors turn inherited sequences on or off without altering the DNA itself.', e:'Children of Holocaust survivors show altered stress-hormone gene expression — trauma epigenetically passed to the next generation.'},
      {t:'Genome', d:'The complete set of hereditary instructions for building an organism.', e:'The complete human DNA sequence contains about 3 billion base pairs and roughly 20,000–25,000 genes.'},
      {t:'Polygenic Traits', d:'Characteristics shaped by many inherited variants of small effect (intelligence, personality) — not controlled by a single inherited unit.', e:'Height and skin color are each influenced by hundreds of genes, varying on a continuum rather than in discrete categories.'},
      {t:'Central Nervous System (CNS)', d:'Brain and spinal cord — the body\'s decision-making command center.', e:'When you touch a hot stove, the signal travels to your spinal cord and brain (CNS), which sends back the command to pull your hand away.'},
      {t:'Peripheral Nervous System (PNS)', d:'All neural fibers outside the CNS; connects the CNS to muscles, glands, and sensory organs.', e:'The nerves in your fingertips that detect temperature and the motor nerves that move your hand are part of the PNS.'},
      {t:'Somatic Nervous System', d:'Controls voluntary skeletal muscle movements.', e:'Intentionally raising your arm or kicking a soccer ball — these voluntary movements are under conscious neural control.'},
      {t:'Autonomic Nervous System (ANS)', d:'Controls involuntary functions (heartbeat, digestion); includes sympathetic and parasympathetic branches.', e:'Your heart speeds up automatically when you get scared — you don\'t consciously control this.'},
      {t:'Sympathetic NS', d:'"Fight-or-flight" — activates the body; raises heart rate, dilates pupils, slows digestion.', e:'Before a big speech, your heart races, palms sweat, and digestion slows — the arousal branch of the autonomic NS is active.'},
      {t:'Parasympathetic NS', d:'"Rest-and-digest" — calms the body after stress; slows heart rate, promotes digestion.', e:'After the speech, your heart rate drops and your body returns to a calm, "rest-and-digest" state.'},
      {t:'Neuron', d:'A nerve cell — the basic building block of the nervous system that transmits electrical and chemical signals.', e:'A single motor nerve cell can stretch from your spinal cord all the way down to the muscles in your foot.'},
      {t:'Dendrites', d:'Branching extensions of a neuron that receive incoming signals from other neurons.', e:'The branchy "antennae" on a nerve cell that pick up incoming signals from neighboring cells — these are the receiving branches.'},
      {t:'Axon', d:'The long fiber that carries action potentials away from the cell body toward other neurons or muscles.', e:'The long "wire" running from a nerve cell body that carries the electrical signal downstream to the next cell — this is the output structure.'},
      {t:'Myelin Sheath', d:'Fatty insulation around an axon that speeds transmission. Damaged in multiple sclerosis.', e:'In multiple sclerosis, this fatty insulating layer breaks down, causing slowed neural signaling — resulting in motor and cognitive impairment.'},
      {t:'Action Potential', d:'A brief electrical charge that travels down the axon when stimulation exceeds the threshold.', e:'Like pulling a trigger — once the threshold is crossed, the electrical charge fires completely down the axon.'},
      {t:'All-or-Nothing Principle', d:'A neuron fires completely or not at all — like a mousetrap; stimulus intensity affects frequency, not strength.', e:'A neuron either fires or it doesn\'t — like a mousetrap. Louder sounds cause neurons to fire more frequently, not more forcefully.'},
      {t:'Threshold', d:'The level of stimulation required to trigger a neural impulse (action potential).', e:'A whisper might not be intense enough to trigger a neural response, but a shout will — once this minimum level is crossed, the action potential fires.'},
      {t:'Post-Action-Potential Recovery Interval', d:'Brief rest period after firing during which the neuron cannot fire again.', e:'Immediately after firing, a neuron cannot fire again — like reloading a gun before the next shot.'},
      {t:'Synapse', d:'The junction between two neurons; neurotransmitters are released here across the synaptic gap.', e:'The microscopic gap between two neurons where serotonin or dopamine is released and picked up by the next neuron.'},
      {t:'Neurotransmitter', d:'Chemical messenger released at the synapse that binds to receptor sites on the receiving cell.', e:'Serotonin is released at the synapse and binds to receptors on the receiving neuron, influencing mood.'},
      {t:'Reuptake', d:'The sending cell recycles excess chemical messengers back from the synaptic gap.', e:'SSRIs block this recycling process for serotonin — so more serotonin stays in the synaptic gap, boosting mood.'},
      {t:'Acetylcholine (ACh)', d:'Enables muscle action, memory, and learning. Low levels → Alzheimer\'s disease.', e:'Botox blocks ACh at neuromuscular junctions, causing temporary facial paralysis. Low ACh is linked to Alzheimer\'s.'},
      {t:'Dopamine', d:'Influences reward, movement, and attention. Low → Parkinson\'s; High → Schizophrenia.', e:'Winning a game or eating a favorite food releases this neurotransmitter, activating the brain\'s reward center. Parkinson\'s results from the cells that produce it dying off.'},
      {t:'Serotonin', d:'Regulates mood, hunger, sleep, and arousal. Low → Depression.', e:'SSRIs like Prozac increase this mood-regulating neurotransmitter\'s availability in the synapse to treat depression.'},
      {t:'GABA', d:'Major inhibitory neurotransmitter — calms brain activity. Low → Seizures and anxiety.', e:'Alcohol enhances this inhibitory neurotransmitter\'s effects, which is why it reduces anxiety and slows reaction time.'},
      {t:'Glutamate', d:'Major excitatory neurotransmitter; involved in memory. Excess → Seizures.', e:'Drugs that block this excitatory neurotransmitter\'s receptors (like ketamine) are being studied as fast-acting antidepressants.'},
      {t:'Endorphins', d:'Natural opioids providing pain relief and pleasure ("runner\'s high"). Released by exercise.', e:'A long-distance runner experiences a "runner\'s high" — these natural pain-suppressing chemicals released by exercise lift mood.'},
      {t:'Agonist', d:'A drug or chemical that increases a neurotransmitter\'s effect by mimicking or enhancing it.', e:'Morphine mimics the brain\'s natural endorphins by binding to the same receptors — a drug that activates rather than blocks them.'},
      {t:'Antagonist', d:'A drug or chemical that blocks a neurotransmitter\'s effect.', e:'Naloxone (Narcan) blocks opioid receptors and reverses overdoses — a drug that opposes rather than activates a receptor.'},
      {t:'Depressants', d:'Drugs that reduce neural activity and slow body functions (e.g., alcohol).', e:'Alcohol slows reaction time, slurs speech, and impairs judgment — all signs of CNS depression.'},
      {t:'Stimulants', d:'Drugs that excite neural activity and speed up body functions (caffeine, nicotine).', e:'A person drinks coffee before an early meeting — caffeine raises heart rate, alertness, and concentration.'},
      {t:'Hallucinogens', d:'Substances that distort perception and evoke sensory experiences without sensory input.', e:'Under the influence of these substances, users may see vivid colors and geometric patterns, or experience cross-sensory effects like "hearing" music as shapes.'},
      {t:'Tolerance', d:'Diminishing effect of the same dose over time — requires larger doses to achieve the same effect.', e:'A coffee drinker needs three cups to feel the same alertness that one cup produced when they first started.'},
      {t:'Addiction', d:'Compulsive drug use despite harmful consequences; driven by changes in the brain\'s reward circuitry.', e:'A person continues gambling despite losing their savings, job, and family — the reward circuitry hijacks rational decision-making.'},
      {t:'Medulla', d:'Lowest brainstem structure; controls heartbeat and breathing — damage can be fatal.', e:'Opioid overdose can be fatal because opioids suppress this brainstem structure\'s control of breathing.'},
      {t:'Reticular Formation', d:'Brainstem nerve network controlling arousal and alertness.', e:'Damage to this arousal-regulating brainstem network can cause a permanent coma.'},
      {t:'Cerebellum', d:'"Little brain" — coordinates balance, smooth movement, and procedural learning.', e:'A person with damage to this hindbrain structure stumbles while walking and has difficulty catching a ball.'},
      {t:'Thalamus', d:'The brain\'s sensory relay station — routes all senses EXCEPT smell to the appropriate cortex.', e:'Visual information from the eyes is routed through this sensory relay station to the occipital lobe for processing.'},
      {t:'Hypothalamus', d:'Controls hunger, thirst, body temperature, and hormonal balance; links nervous and endocrine systems; contains reward center.', e:'When you are dehydrated, this small structure below the thalamus triggers thirst; it also regulates body temperature when overheated.'},
      {t:'Hippocampus', d:'Limbic structure critical for forming new explicit (conscious) memories. Damaged → anterograde amnesia.', e:'H.M. had this memory-forming structure removed to stop seizures and afterward could not form any new long-term memories.'},
      {t:'Amygdala', d:'Limbic structure linked to fear, rage, and emotional processing. Damaged → reduced fear response.', e:'A soldier with damage to this almond-shaped structure fails to show fear responses even in life-threatening situations.'},
      {t:'Limbic System', d:'Brain structures below the cortex linked to emotion, memory, and drives (amygdala, hippocampus, hypothalamus).', e:'A smell (like a grandparent\'s perfume) triggers a vivid emotional memory — routed through this emotion-and-memory brain network.'},
      {t:'Cerebral Cortex', d:'The thin outer layer covering the brain; the body\'s ultimate information-processing center.', e:'The wrinkled outer surface visible in brain images — the seat of language, reasoning, and conscious thought.'},
      {t:'Frontal Lobe', d:'Behind the forehead; executive functions, planning, decision-making, personality, motor cortex, Broca\'s area.', e:'Phineas Gage\'s personality became impulsive and profane after an iron rod destroyed part of this anterior brain region.'},
      {t:'Parietal Lobe', d:'Top-rear of brain; processes touch and body position (somatosensory cortex).', e:'When a doctor pokes your arm and asks where you feel it, the somatosensory cortex in this touch-processing region handles that sensation.'},
      {t:'Occipital Lobe', d:'Back of brain; processes ALL visual information. Damage → blindness in visual field.', e:'A blow to the back of the head can cause temporary "seeing stars" — this posterior visual-processing region was momentarily disrupted.'},
      {t:'Auditory & Language Processing Brain Region', d:'Located above the ears; interprets sounds and speech comprehension (Wernicke\'s area); face recognition in the right hemisphere.', e:'Wernicke\'s aphasia results from left temporal lobe damage — the patient speaks fluently but the words make no sense.'},
      {t:'Motor Cortex', d:'Rear of frontal lobe; controls voluntary movements. Larger brain area = more precise control needed.', e:'Fingertips and lips take up disproportionately large areas in this movement-control region because they require precise fine control.'},
      {t:'Somatosensory Cortex', d:'Front of parietal lobe; processes touch sensations. More sensitive body parts = more cortical space.', e:'Lips and fingertips have more of this touch-mapping region devoted to them than the back, which is why they are more sensitive to stimulation.'},
      {t:'Left Frontal Speech Production Zone', d:'A cortical region controlling verbal output. Damage → Broca\'s aphasia — halting, effortful talking with intact comprehension.'},
      {t:'Wernicke\'s Area', d:'Left temporal lobe; controls language COMPREHENSION. Damage → fluent but meaningless speech.'},
      {t:'Corpus Callosum', d:'Band of axons connecting the left and right brain hemispheres; severed in split-brain patients.', e:'In split-brain patients, an image shown only to the left visual field cannot be named, but the left hand can pick out the matching object.'},
      {t:'Neuroplasticity', d:'The brain\'s ability to rewire itself by forming new brain pathways — greatest in childhood but lifelong.', e:'After a stroke destroys the speech area, some patients gradually recover as nearby brain regions take over the function.'},
      {t:'Neurogenesis', d:'The formation of new nerve cells — occurs in adult humans in some brain regions.', e:'Exercise promotes new nerve cell growth in the hippocampus, which may explain why aerobic activity enhances memory.'},
      {t:'Split-Brain Research', d:'Severing corpus callosum to stop epilepsy; revealed that hemispheres can function independently.', e:'Sperry & Gazzaniga showed that severing the corpus callosum left the hemispheres unable to share information — one hand literally didn\'t know what the other was doing.'},
      {t:'Circadian Rhythm', d:'The body\'s ~24-hour biological clock; controls sleep-wake cycle, body temperature, and alertness.', e:'Jet lag occurs when your internal biological clock is out of sync with the local light-dark cycle.'},
      {t:'Rapid Eye Movement Stage', d:'Dreaming phase: brain is highly active, voluntary muscles are temporarily paralyzed; critical for memory consolidation and emotional regulation.', e:'During a vivid chase dream, your eyes dart beneath your eyelids; your body is paralyzed so you do not act out the dream.'},
      {t:'Non-REM Restorative Stages (1–3)', d:'Quiet sleep phases progressing from light dozing (first phase) to deep delta-wave sleep (third phase); physically rejuvenating.', e:'In Stage 1 you might jerk awake (hypnic jerk); in Stage 3 you are in deep sleep and very hard to awaken.'},
      {t:'Stage 2 Neural Burst Pattern', d:'Sleep spindles — brief surges of brain activity that appear in the second sleep phase; linked to memory consolidation.', e:'Sleep spindles in the second sleep phase are associated with the brain consolidating what you studied before bed.'},
      {t:'Stage 3 Slow Brainwave Pattern', d:'Delta waves dominate the deepest sleep phase — the hardest to wake from; essential for physical recovery.', e:'Delta-wave sleep is when sleepwalking and night terrors typically occur — the brain is active but the sleeper is deeply unresponsive.'},
      {t:'Melatonin', d:'Hormone produced by pineal gland in darkness; signals the brain that it is time to sleep.', e:'Looking at bright screens at night suppresses this sleep-onset hormone, making it harder to fall asleep.'},
      {t:'Insomnia', d:'Chronic difficulty falling or staying asleep — most common sleep disorder.', e:'An anxious student lies awake at 2 AM ruminating about an exam, unable to fall asleep despite exhaustion.'},
      {t:'Narcolepsy', d:'Sudden uncontrollable sleep attacks during the day; REM sleep intrudes into wakefulness.', e:'A person laughing suddenly collapses into REM sleep — called cataplexy, a hallmark feature of this sleep disorder.'},
      {t:'Nocturnal Breathing Interruption Condition', d:'Airway repeatedly collapses during sleep, halting respiration; results in daytime fatigue, poor concentration, and cardiovascular risk.', e:'A snoring partner\'s airway repeatedly collapses for 10–30 seconds throughout the night, causing daytime exhaustion.'},
      {t:'Sensation', d:'The process by which specialized receptors pick up and encode stimulus energy.', e:'Your ears detect sound waves; your skin detects pressure — these are raw signals before the brain interprets them.'},
      {t:'Transduction', d:'Converting physical stimulus energy (light, sound, pressure) into neural signals the brain can process.', e:'Light waves hit the retina → photoreceptors convert them into electrical signals → your brain processes the image.'},
      {t:'Absolute Threshold', d:'Minimum stimulus detected at least 50% of the time.', e:'You can just barely hear a tone in a quiet room 50% of the time — that is the minimum detectable level for that frequency.'},
      {t:'Weber\'s Law', d:'The JND (just noticeable difference) is a constant proportion of the original stimulus — larger stimuli need bigger changes.'},
      {t:'Sensory Adaptation', d:'Reduced responsiveness to a constant, unchanging stimulus over time.', e:'Jumping into a cold pool feels shocking at first, but within minutes the temperature seems normal.'},
      {t:'Rods', d:'Retinal cells for black-and-white vision in dim light; detect peripheral motion; ~120 million per eye.', e:'In a dark movie theater, these dim-light photoreceptors detect shapes and movement, which is why colors look washed out.'},
      {t:'Cones', d:'Retinal cells for color vision and detail; require bright light; concentrated in the fovea.', e:'You need bright light to read a colorful infographic — these color photoreceptors in the fovea detect fine detail and hue.'},
      {t:'Trichromatic Theory', d:'Three types of hue-sensitive receptors (red, green, blue) combine to produce every visible shade.', e:'Computer monitors mix red, green, and blue pixels to produce any color you see on screen.'},
      {t:'Opponent-Process Theory', d:'Vision encoded by ganglion cells in rival pairs (red/green, blue/yellow) — explains afterimages.', e:'Staring at a red square for 30 seconds then looking at a white wall produces a green afterimage — the channel tuned to red triggers its paired opposite.'},
      {t:'Spinal Cord Pain Signal Modulation Theory', d:'Neural "gates" in the dorsal horn can open or close to block or amplify nociceptive input before it reaches conscious awareness.', e:'Rubbing a bumped elbow reduces discomfort because touch input "closes the gate" on nociceptive input in the dorsal horn.'},
      {t:"Weber's Law", d:'The JND is a constant proportion of the original stimulus — larger stimuli need bigger changes to notice a difference (e.g., 1/50 for weight). Named after Ernst Weber.'},
      {t:'Edge-and-Angle Response Neurons (Hubel & Wiesel)', d:'Feature detector cells in the visual cortex, each tuned to a specific property such as line orientation, tilt, or direction of motion; discovered by Nobel-winning researchers in 1981.', e:'Certain cells in your visual cortex respond only to horizontal lines; others only to diagonal lines — discovered in cats by Nobel-winning researchers.'},
      {t:'Parallel Processing', d:'The brain simultaneously handles multiple aspects of a stimulus — color, motion, depth, and shape all at once.', e:'You instantly perceive the color, shape, and motion of a flying bird simultaneously — not one feature at a time.'},
      {t:'Inattentional Blindness', d:'Failing to notice a fully visible but unexpected object because focus is directed elsewhere — demonstrated by Simons & Chabris Gorilla Experiment.', e:'Participants counting basketball passes do not notice a person in a gorilla suit walking through — the Gorilla Experiment.'},
      {t:'Perceptual Set', d:'A mental predisposition to interpret one thing rather than another — shaped by experience, context, mood, and expectations.', e:'An X-ray technician looking for tumors will "see" one more readily than a radiologist not expecting pathology.'},
      {t:'Perceptual Constancy', d:'Experiencing objects as stable (same color, shape, size) despite changes in illumination and the retinal image.', e:'A door looks rectangular whether it is open at an angle or closed — the brain maintains a stable object representation despite changing retinal input.'},
      {t:'Phi Phenomenon', d:'The illusion of movement created when adjacent stationary lights flash in sequence — Gestalt psychologists\' term, the basis of motion pictures.', e:'Old-fashioned theater marquees with sequentially blinking lights appear to show moving arrows — an illusion of motion from a series of static stimuli.'},
      {t:'Kinesthesis', d:'The sense of the position and movement of body parts — receptors in muscles, tendons, and joints.'},
      {t:'Vestibular Sense', d:'Balance and spatial orientation system; semicircular canals in the inner ear detect head rotation and gravity.'},
      {t:'Frequency Theory (Hearing)', d:'Pitch is determined by how rapidly the basilar membrane vibrates — best explains low-pitched sounds (below ~4,000 Hz).'},
      {t:'Place Theory (Hearing)', d:'Different pitches activate different locations on the basilar membrane — explains high-frequency pitches (von Békésy, Nobel 1961).'},
      {t:'Conduction Hearing Loss', d:'Caused by mechanical damage to the outer or middle ear that prevents sound waves from reaching the cochlea — often treatable.'},
      {t:'Sensorineural Hearing Loss', d:'Caused by damage to cochlear hair cells or the auditory nerve — the most common type; often from prolonged loud noise exposure; not reversible.'},
      {t:'Selective Attention', d:'Focusing conscious awareness on a particular stimulus while filtering out others — demonstrated by the cocktail party effect and cherry-picking tasks.'},
      {t:'Cocktail Party Effect', d:'The ability to focus on one conversation in a noisy room while still detecting your own name in another conversation — selective attention at work.'},
    ]
  },

  // ── UNIT 2: Cognition ──────────────────────────────
  u2: {
    label:'Unit 2 — Cognition', tag:'Unit 2', color:'#00b3a4',
    cards:[
      {t:'Perception', d:'The brain\'s process of organizing and interpreting sensory information to give it meaning.'},
      {t:'Bottom-Up Processing', d:'Perception built from raw sensory data — data-driven, starting with the stimulus itself.'},
      {t:'Top-Down Processing', d:'Prior knowledge, expectations, and schemas guide perception — brain fills in what it expects to see.'},
      {t:'Schema', d:'A mental framework organizing and interpreting information; influences how we perceive new situations.', e:'A child has a "dog" mental framework: four legs, fur, barks. When she sees a cat, she applies that existing framework until she updates it.'},
      {t:'Gestalt Principles', d:'Visual organization rules: proximity, similarity, closure, continuity, figure-ground.'},
      {t:'Inattentional Scene Alteration Failure', d:'Failing to notice gradual or sudden changes in the visual field due to divided attentional focus.'},
      {t:'Retinal Disparity', d:'Binocular depth cue: slight difference between images in left and right eyes creates depth perception.'},
      {t:'Algorithm', d:'A step-by-step procedure guaranteed to find the correct solution — methodical but slow.', e:'Checking every possible combination on a 4-digit lock (0000 to 9999) uses this method — guaranteed to find the answer but slow.'},
      {t:'Heuristic', d:'Mental shortcut for quick approximate judgments — fast but prone to errors.', e:'A doctor estimates a patient\'s age from bone density on an X-ray — a mental shortcut that is usually accurate but not guaranteed.'},
      {t:'Availability Heuristic', d:'Judging the likelihood of events based on how easily examples come to mind.', e:'After news coverage of shark attacks, people overestimate the likelihood of being attacked by a shark.'},
      {t:'Representativeness Heuristic', d:'Judging likelihood based on how well something matches our prototype or stereotype.', e:'Judging a quiet, orderly person who likes puzzles as a librarian rather than a truck driver — matching to a stereotype.'},
      {t:'Mental Set', d:'The tendency to approach a problem using the same strategy that worked before.', e:'You always open stuck jar lids by twisting; a new type requires pressing a button — your old strategy blinds you to the new solution.'},
      {t:'Functional Fixedness', d:'Inability to see an object as serving a purpose beyond its typical use.', e:'You need a screwdriver but only see a butter knife — not realizing the knife could turn the screw.'},
      {t:'Confirmation Bias', d:'The tendency to search for and favor information that supports our existing beliefs.', e:'A flat-earther only reads articles that support flat-earth theory and dismisses contradictory evidence.'},
      {t:'Cognitive Dissonance', d:'Mental discomfort from holding conflicting beliefs or when actions contradict beliefs; motivates change.', e:'A smoker knows smoking causes cancer but continues, telling themselves "my grandpa smoked and lived to 95" to reduce the mental conflict.'},
      {t:'Framing Effect', d:'People respond differently to the same information depending on how it is presented.', e:'"90% survival rate" surgery sounds more appealing than "10% mortality rate" — same fact, different frame.'},
      {t:'Explicit Memory', d:'Conscious recall: episodic (personal events) and semantic (facts, concepts).'},
      {t:'Implicit Memory', d:'Unconscious retention of skills and procedures (procedural knowledge) — doesn\'t require conscious recall.'},
      {t:'Working Memory', d:'An active cognitive buffer where information is held and manipulated; limited capacity (~7±2 items).', e:'While solving a math problem in your head, you hold intermediate numbers in active mental storage.'},
      {t:'Multi-Store Model', d:'Atkinson-Shiffrin: Sensory Memory → Short-Term Memory → Long-Term Memory.'},
      {t:'Sensory Memory', d:'Brief buffer: Iconic (visual, <1 sec) and Echoic (auditory, 3–4 sec).', e:'The brief afterimage from a camera flash is iconic storage — it lasts less than half a second before fading.'},
      {t:'Long-Term Potentiation (LTP)', d:'Repeated synapse activation strengthens neural connections — the biological basis of memory formation.'},
      {t:'Levels of Processing', d:'Deeper encoding = better memory. Structural (shallow) < Phonemic < Semantic (deepest).'},
      {t:'Encoding', d:'The initial process of getting information into the memory system.', e:'Studying by making up a story using vocabulary words is a form of elaborative processing that deepens memory formation.'},
      {t:'Mnemonic Device', d:'A memory aid using associations, acronyms, rhymes, or images to improve encoding.'},
      {t:'Method of Loci', d:'"Memory palace" — linking items to familiar locations along a mental route.'},
      {t:'Distributed Practice Advantage', d:'Spacing out study sessions across days or weeks produces far better long-term retention than cramming everything into one block.', e:'Studying vocabulary 30 minutes per day for 5 days beats cramming all 2.5 hours the night before.'},
      {t:'Serial Position Effect', d:'Best recall for items at the beginning (primacy) and end (recency) of a list.', e:'You remember the first few and last few items on a grocery list but forget the middle ones.'},
      {t:'Chunking', d:'Grouping information into meaningful units to expand effective working memory capacity.', e:'Memorizing 149217761865 is hard; splitting it into 1492, 1776, 1865 (historical dates) makes it easy.'},
      {t:'Recall', d:'Retrieving information without cues — harder (e.g., essay questions).'},
      {t:'Recognition', d:'Identifying previously encountered information when it is presented — easier (e.g., multiple choice).'},
      {t:'Context-Dependent Memory', d:'Recall is better when retrieval occurs in the same environment as encoding.', e:'Divers who memorized words underwater recalled them better underwater than on land — the surrounding environment acts as a retrieval cue.'},
      {t:'Mood-Congruent Memory', d:'We more easily recall information that matches our current emotional state.', e:'When you are anxious, you more easily recall other anxious moments — emotional state primes retrieval of similarly-toned events.'},
      {t:'Testing Effect', d:'Active retrieval practice (self-quizzing) produces far better long-term retention than re-reading.', e:'Instead of rereading your notes, you cover them and quiz yourself — retrieval practice strengthens memory more than passive review.'},
      {t:'Retrograde Amnesia', d:'Inability to retrieve stored information from BEFORE brain damage.', e:'A person in a car accident forgets the 30 minutes leading up to the crash but remembers everything before.'},
      {t:'Anterograde Amnesia', d:'Inability to form NEW long-term records after brain damage (e.g., Patient H.M.).', e:'H.M. could not form new memories after his hippocampus was removed — he re-met his doctors every day with no recognition.'},
      {t:'Forgetting Curve', d:'Ebbinghaus: ~70% of information fades within 24 hours; the rate of decline then levels off.'},
      {t:'Proactive Interference', d:'OLD memories disrupt the learning of NEW information.', e:'Your old locker combination keeps popping into your head when you try to remember your new one.'},
      {t:'Retroactive Interference', d:'NEW memories disrupt recall of OLD information.', e:'After learning Spanish, you start forgetting some French words you had learned before.'},
      {t:'Misinformation Effect', d:'Post-event details distort the original memory (Loftus — leading questions change eyewitness reports).', e:'After seeing a car accident, someone asks "How fast were the cars going when they smashed?" — subjects later recall more damage than occurred.'},
      {t:'Source Amnesia', d:'Retaining information but being unable to recall where or when you encountered it.'},
      {t:'Constructive Memory', d:'What we recall is rebuilt each time it is retrieved — it can shift with each reintegration.'},
      {t:'General Intelligence (g)', d:'Spearman\'s concept of a single underlying mental ability that influences all cognitive tasks.', e:'Students who excel in math tend to also excel in reading and history — Spearman argued this reflects a common "g" factor.'},
      {t:'Multiple Intelligences (Gardner)', d:'Cognitive aptitude comes in many distinct forms: linguistic, logical-math, spatial, musical, bodily-kinesthetic, interpersonal, intrapersonal, naturalist.', e:'A child who struggles academically but excels as a musician may have high musical intelligence — one of eight proposed ability types.'},
      {t:'IQ', d:'Intelligence Quotient; a standardized score relative to age peers, with 100 as the average and 15 as one standard deviation.'},
      {t:'Standardization', d:'Establishing uniform procedures for administering and scoring a test; creating norms from representative sample.', e:'IQ tests are given under identical conditions to everyone to ensure fair comparison across test-takers.'},
      {t:'Reliability', d:'A test produces consistent results across repeated administrations.', e:'A well-designed IQ test gives you nearly the same score each time you take it — it is reliable.'},
      {t:'Validity', d:'A test measures what it claims to measure.', e:'An IQ test is valid if it actually predicts school performance, job success, and other real-world outcomes.'},
      {t:'Flynn Effect', d:'Global IQ scores have risen over generations — attributable to environmental improvements (nutrition, education).', e:'Average IQ scores have risen about 3 points per decade worldwide — probably due to better nutrition, education, and test familiarity.'},
      {t:'Stereotype Threat', d:'Awareness of a negative generalization about one\'s group can lower performance on relevant tasks.', e:'A Black student reminded of negative group expectations before a difficult test scores lower — worry about confirming bias impairs performance.'},
      {t:'Growth Mindset', d:'Dweck: Belief that intelligence and abilities can be developed through effort — predicts better achievement.'},
      {t:'Assimilation', d:'Piaget: interpreting a new experience in terms of an existing schema — fitting new info into current knowledge frameworks.', e:'A toddler calls a horse "doggie" — fitting the horse into her existing "dog" schema.'},
      {t:'Accommodation', d:'Piaget: modifying or creating a new schema to fit a new experience that cannot be assimilated into existing ones.', e:'After being corrected, the child creates a new "horse" schema — she has accommodated the new information.'},
      {t:'Creativity', d:'The ability to produce novel and useful ideas; involves divergent thinking, intrinsic motivation, expertise, and imaginative thinking.'},
      {t:'Convergent Thinking', d:'Narrowing options to find a single correct answer — the cognitive approach measured by traditional IQ tests.'},
      {t:'Divergent Thinking', d:'Generating many possible solutions by exploring multiple alternatives — associated with creativity and open-ended problem-solving.'},
      {t:'Priming', d:'Activation of particular associations in memory — exposure to one stimulus unconsciously influences response to a later related stimulus.'},
      {t:'State-Dependent Memory', d:'Recall is best when the person is in the same internal condition as during encoding (e.g., mood, arousal level, drug condition).', e:'A person who hid money while drunk struggles to find it when sober but locates it when drunk again.'},
      {t:'Decay Theory', d:'Memory fades over time through disuse if not rehearsed — distinct from interference (which involves competing memories).'},
      {t:'Encoding Failure', d:'The most common cause of forgetting: information was never deeply processed and stored in the first place.'},
      {t:'Crystallized Intelligence', d:'Cattell: accumulated knowledge and verbal skills — tends to increase with age and experience.', e:'A retired professor still excels at trivia and vocabulary — this knowledge-based ability holds up well with age.'},
      {t:'Fluid Intelligence', d:'Cattell: the ability to reason speedily and abstractly — tends to decline with aging, especially after age 75.', e:'Solving a novel logic puzzle you have never seen before requires this flexible reasoning ability.'},
      {t:'Triarchic Theory (Sternberg)', d:'Three types of intelligence: Analytical (school smarts), Creative (novel situations), and Practical (street smarts/common sense).', e:'A student who aces tests (analytical), starts their own business (practical), and invents a product (creative) shows all three intelligence types in this framework.'},
      {t:'Emotional Intelligence', d:'Salovey & Mayer: ability to perceive, understand, manage, and apply feelings and affect skillfully — predicts relationship success and leadership.'},
      {t:'Savant Syndrome', d:'A condition where someone with limited overall mental ability has a remarkable specific talent (music, math, drawing) — challenges narrow IQ views.'},
    ]
  },

  // ── UNIT 3: Development & Learning ─────────────────
  u3: {
    label:'Unit 3 — Development & Learning', tag:'Unit 3', color:'#f0A500',
    cards:[
      {t:'Developmental Psychology', d:'The study of how people grow, change, and stay the same across the lifespan.', e:'Researchers follow children from birth to age 18, measuring language, cognition, and social skills at each stage.'},
      {t:'Cross-Sectional Research', d:'Comparing different age groups at the same point in time; quick but may show cohort effects.'},
      {t:'Longitudinal Research', d:'Following the same individuals over a long period; more accurate but time-consuming.'},
      {t:'Teratogen', d:'Any substance (alcohol, drugs, toxins) that can cause birth defects during prenatal development.', e:'Alcohol consumed during pregnancy can cause fetal alcohol syndrome — a prime example of a harmful prenatal substance.'},
      {t:'Critical Period', d:'A specific developmental window when exposure to certain stimuli is essential for normal development.'},
      {t:'Rooting Reflex', d:'Newborn turns head toward cheek touch and begins sucking — an innate survival mechanism.'},
      {t:'Piaget\'s Milestone for Hidden Item Awareness', d:'Understanding that objects continue to exist even when out of sight; develops around 8 months.', e:'A 10-month-old watches a toy get hidden under a blanket and then reaches for it — she knows the toy still exists.'},
      {t:'Conservation', d:'Understanding that quantity remains the same even when shape changes; develops in concrete operational stage.', e:'A child understands that pouring water from a short wide glass into a tall narrow glass does not change the amount of water.'},
      {t:'Piaget\'s 4 Stages', d:'Sensorimotor (0–2), Preoperational (2–7), Concrete Operational (7–11), Formal Operational (12+).'},
      {t:'Egocentrism', d:'Preoperational child\'s inability to see the world from another person\'s perspective.'},
      {t:'Theory of Mind', d:'Understanding that others have thoughts, beliefs, and desires different from one\'s own.', e:'A 4-year-old understands that her friend does not know where the candy is hidden — the friend has a different belief (false-belief task).'},
      {t:'Zone of Proximal Development (ZPD)', d:'Vygotsky: tasks a learner can do with guidance but not yet independently.', e:'A student cannot factor quadratics alone but can with the teacher\'s hints — the task is in their ZPD.'},
      {t:'Scaffolding', d:'Temporary support provided by a more skilled person to help a learner accomplish tasks in the ZPD.', e:'A parent holds the back of a child\'s bike while they learn to balance — gradually removing support as the child improves.'},
      {t:'Phoneme', d:'The smallest unit of sound in a language (e.g., "b" in "bat").', e:'The word "cat" has three distinct sound units: /k/, /æ/, /t/.'},
      {t:'Morpheme', d:'The smallest unit of meaning in a language (e.g., "un-" + "happy").', e:'"Unbreakable" has three meaning units: un-, break, -able — each contributes to the overall meaning.'},
      {t:'Telegraphic Speech', d:'Two-word sentences used by toddlers leaving out function words ("want cookie").'},
      {t:'Overgeneralization', d:'Applying grammar rules too broadly ("I goed home") — shows the child is actively constructing language.'},
      {t:'Attachment', d:'An emotional bond between infant and caregiver; a secure version of this bond supports healthy development.', e:'A secure toddler plays freely while her mother is present, cries briefly when she leaves, and calms quickly when she returns.'},
      {t:'Harlow\'s Contact Comfort Experiments', d:'Infant monkeys preferred soft cloth mother over wire mother with food — physical warmth and touch drive bonding more than nourishment.'},
      {t:'Parenting Styles', d:'Authoritarian (strict), Authoritative (warm + structured), Permissive (warm, low structure). Authoritative generally best outcomes.'},
      {t:'Erikson\'s 8 Stages', d:'Trust vs. Mistrust → Autonomy → Initiative → Industry → Identity → Intimacy → Generativity → Integrity.'},
      {t:'Erikson\'s Stage 5: Adolescent Self-Definition', d:'A developmental period in which teens explore different roles, values, and peer groups to forge a stable personal identity.', e:'A teenager tries on different friend groups, values, and clothing styles to figure out who they are.'},
      {t:'Bronfenbrenner\'s Ecological Theory', d:'Development is shaped by nested societal layers: Microsystem, Mesosystem, Exosystem, Macrosystem, Chronosystem.'},
      {t:'UCS (Unconditioned Stimulus)', d:'Something that naturally and automatically triggers a reaction without any prior learning (e.g., food causing salivation).'},
      {t:'UCR (Unconditioned Response)', d:'The natural, automatic reaction to the UCS that requires no learning (e.g., salivating when food appears).'},
      {t:'CS (Conditioned Stimulus)', d:'A previously neutral cue that, after repeated pairing with the UCS, comes to elicit the CR on its own.'},
      {t:'CR (Conditioned Response)', d:'The acquired reaction elicited by the CS alone, after learning has occurred.'},
      {t:'Extinction (Classical)', d:'The CR weakens and disappears when the CS is repeatedly presented without the UCS.'},
      {t:'Spontaneous Recovery', d:'Resurgence of an extinguished CR after a rest period.', e:'After extinction and a rest period, the dog salivates again when it hears the bell — the CR has unexpectedly reappeared on its own.'},
      {t:'Stimulus Generalization', d:'Responding to cues similar to the original CS.'},
      {t:'Stimulus Discrimination', d:'Responding only to the specific CS and not to similar cues.'},
      {t:'Counterconditioning', d:'Replacing a learned emotional response with the opposite — basis of systematic desensitization.'},
      {t:'Positive Reinforcement', d:'ADD something desirable → behavior INCREASES (praise after studying).', e:'A dog sits → gets a treat → more likely to sit in the future.'},
      {t:'Negative Reinforcement', d:'REMOVE something aversive → behavior INCREASES (buckling seatbelt stops the beeping). NOT punishment.', e:'Taking ibuprofen removes a headache → you are more likely to take ibuprofen next time (pain removal reinforces the behavior).'},
      {t:'Positive Punishment', d:'ADD something aversive → behavior DECREASES (speeding ticket).', e:'A student talks in class → teacher gives detention → student talks less.'},
      {t:'Negative Punishment', d:'REMOVE something desirable → behavior DECREASES (losing phone privileges).', e:'A teenager comes home late → parents take away their phone → teenager comes home on time.'},
      {t:'Shaping', d:'Reinforcing successive approximations toward a desired behavior.', e:'Training a dolphin to jump: first reward approaching the hoop, then touching it, then jumping partway, then the full jump.'},
      {t:'Variable Ratio Schedule', d:'Reinforcement after unpredictable number of responses — highest response rate, most resistant to extinction (slot machines).'},
      {t:'Fixed Ratio Schedule', d:'Reinforcement after a set number of responses — high steady rate with brief pause after each reward.'},
      {t:'Variable Interval Schedule', d:'Reinforcement after unpredictable amounts of time — steady moderate response rate.'},
      {t:'Fixed Interval Schedule', d:'Reinforcement after a set time has passed — scalloped pattern; responding surges near the end of each period.'},
      {t:'Learned Helplessness', d:'Seligman: after experiencing uncontrollable events, organisms stop trying even when control becomes possible. Linked to depression.', e:'Dogs shocked with no escape option stop trying to escape even when escape becomes possible — a model for depression.'},
      {t:'Social Learning Theory (Bandura)', d:'Behavior is gained through observing and modeling others — no direct reinforcement needed.'},
      {t:'Vicarious Conditioning', d:'Learning by watching someone else be reinforced or punished for a behavior.'},
      {t:'Self-Efficacy', d:'Bandura: one\'s belief in their ability to execute behaviors to produce specific outcomes.', e:'A student who succeeded on past difficult tests believes she can handle the AP exam — strong belief in her own capability.'},
      {t:'Bobo Doll Study', d:'Children who observed an adult hitting an inflatable toy later imitated that aggression — observational learning.'},
      {t:'Latent Learning', d:'Tolman: knowledge acquired without reinforcement but not demonstrated until there is an incentive to do so.', e:'A student learns the campus layout just by walking around; later, when they need to find a building, they use that stored knowledge.'},
      {t:'Insight Learning', d:'Köhler: sudden "aha!" solution to a problem without trial-and-error — cognitive understanding.'},
      {t:'Zygote', d:'A fertilized egg — the single cell formed when sperm and egg unite, containing the full 46-chromosome genetic blueprint.'},
      {t:'Embryo', d:'The developing human organism from 2 weeks to about 2 months after fertilization — period of rapid organ formation.'},
      {t:'Fetus', d:'The developing organism from about 9 weeks after conception until birth — organs complete; growth and refinement continue.'},
      {t:'Stranger Anxiety', d:'Wariness toward unfamiliar people that infants display beginning around 8 months — signals healthy bonding forming with caregivers.'},
      {t:'Secure Attachment', d:'Ainsworth: infant uses caregiver as a trusted home base; distressed when separated, easily soothed on return — best long-term outcomes.', e:'The toddler uses mom as a "safe base" to explore — confident and trusting.'},
      {t:'Insecure Attachment', d:'Ainsworth: anxious/avoidant (little distress, avoids parent on return) or anxious/ambivalent (clingy, not comforted on return).', e:'An anxious-ambivalent toddler clings to mom and cannot be soothed when she returns, alternating between seeking and resisting her.'},
      {t:'Authoritarian Parenting', d:'High demands, low warmth — strict rules, punishment, little explanation. Associated with obedient but less happy, lower self-esteem children.', e:'"Because I said so." — rules without explanation; obedience over understanding.'},
      {t:'Authoritative Parenting', d:'High demands, high warmth — explains rules, listens, firm but loving. Associated with best outcomes: competent, happy, self-reliant.', e:'Parents set a curfew, explain the reasons, and listen to the teen\'s perspective before adjusting if warranted.'},
      {t:'Permissive Parenting', d:'Low demands, high warmth — few rules, very indulgent. Children tend to be more impulsive, with lower achievement and less self-regulation.', e:'A parent lets their child stay up until midnight on school nights because they don\'t want to seem strict.'},
      {t:'Puberty', d:'A period of physical and hormonal development during adolescence in which the body matures into adulthood — begins earlier in girls than boys.', e:'During early adolescence, a young person experiences rapid physical growth, hormonal changes, and the onset of adult physical characteristics.'},
      {t:'Menarche', d:"A girl's first menstrual period — a milestone of female puberty, typically occurring around age 12–13."},
      {t:'Gender Role', d:'A set of expected behaviors, attitudes, and traits for males or females in a given culture — varies across cultures and history.'},
      {t:'Bem\'s Sex-Typed Mental Template Theory', d:'Bem: children form cognitive blueprints (schemas) for sex-linked behaviors and use them to organize self-concept and perceptions.', e:'A 5-year-old says "boys don\'t wear pink" — she has absorbed cultural gender categories into her thinking.'},
      {t:'Identity Achievement', d:"Marcia: the adolescent has explored alternatives and committed to an identity — the healthiest outcome. Often reached in early adulthood."},
      {t:'Identity Moratorium', d:'Marcia: actively exploring self-concept options but not yet committed — a healthy transitional phase of active searching.'},
      {t:'Identity Foreclosure', d:'Marcia: committed to a self-concept without exploring — typically adopts parents\' values unquestioningly, without crisis.'},
      {t:'Identity Diffusion', d:'Marcia: neither exploring nor committed — drifting without direction; associated with the poorest adjustment outcomes.'},
      {t:'Acquisition (Conditioning)', d:'The initial training phase in classical learning — a neutral cue gradually becomes associated with a UCS and begins eliciting a CR.'},
      {t:'Higher-Order Conditioning', d:'An established CS is used to create an association with a new neutral stimulus — the new stimulus becomes a CS through pairing with the original CS.', e:'After a bell predicts food, a light is paired with the bell — the light alone now produces salivation.'},
      {t:'Law of Effect (Thorndike)', d:'Responses followed by satisfying outcomes are strengthened; responses followed by discomfort are weakened — precursor to operant conditioning.', e:'A cat in a puzzle box presses a lever by accident; the door opens; the cat escapes faster each subsequent trial.'},
      {t:'Continuous Reinforcement', d:'Every correct response is followed by a payoff — fastest acquisition but quickest extinction once payoffs stop.', e:'A vending machine gives a snack every time you insert money — easy to extinguish when it stops working.'},
      {t:'Partial (Intermittent) Reinforcement', d:'Only some responses are followed by a payoff — slower acquisition but far more resistant to extinction than a continuous schedule.'},
      {t:'Cognitive Map', d:'Tolman: a mental representation of the spatial layout of an environment — rats learn maze layout even without reward, showing latent learning.', e:'Tolman\'s rats navigated a maze via the shortest route even when their learned path was blocked — they had a mental map.'},
      {t:'Observational Learning', d:'Picking up behavior by watching and imitating others — no direct experience or reinforcement needed. Bandura\'s key concept.', e:'A child watches a parent flip pancakes and then tries to flip them the same way — knowledge acquired through watching others.'},
      {t:'Mirror Neurons', d:'Nerve cells that fire both when performing an action AND when observing someone else perform it — possible neural basis for imitation and empathy.', e:'Watching a guitarist play activates the same cells in your motor cortex as if you were actually playing.'},
      {t:'Aversive Conditioning', d:'A behavior therapy that pairs a noxious stimulus with an unwanted behavior to reduce it (e.g., nausea-inducing drug + alcohol).'},
    ]
  },

  // ── UNIT 4: Social Psychology & Personality ────────
  u4: {
    label:'Unit 4 — Social Psychology & Personality', tag:'Unit 4', color:'#e0513a',
    cards:[
      {t:'Fundamental Attribution Error (FAE)', d:'Overestimating dispositional (character) causes and underestimating situational causes of OTHERS\' behavior.'},
      {t:'Actor-Observer Bias', d:'Attributing OWN behavior to the situation, but attributing others\' behavior to their character.', e:'When you slip on ice, you blame the ice (external); when you see someone else slip, you think they are clumsy (internal).'},
      {t:'Self-Serving Bias', d:'Attributing successes to our own skill (internal) and failures to external factors — protects our esteem.', e:'You passed the test because you\'re smart; you failed because the teacher writes bad questions.'},
      {t:'Locus of Control', d:'Internal (I determine outcomes) vs. External (luck or others determine outcomes).', e:'Internal: "I failed because I did not study enough." External: "The test was unfair and I had bad luck."'},
      {t:'Mere Exposure Effect', d:'We tend to like things more the more we are exposed to them.', e:'Songs that play repeatedly on the radio become more liked over time — familiarity alone increases preference.'},
      {t:'Self-Fulfilling Prophecy', d:'A belief that becomes true because people act in ways that confirm it — a repeating loop of prediction and action.'},
      {t:'Stereotype', d:'A generalized belief about a group that is applied to all its members.'},
      {t:'Prejudice', d:'An unjustified negative attitude toward a group or its members.', e:'Assuming a woman applying for a tech job is less qualified than a man before reviewing her resume.'},
      {t:'Discrimination', d:'Unjustified negative behavior toward a group or its members.', e:'A landlord refuses to rent to someone because of their race despite their good financial record.'},
      {t:'Just-World Phenomenon', d:'The belief that people get what they deserve — leads to blaming victims.'},
      {t:'In-Group Bias', d:'Favoring members of one\'s own social circle over members of outside circles.', e:'Sports fans perceive their own team\'s fouls as accidental but the opposing team\'s as deliberate.'},
      {t:'Implicit Association Test (IAT)', d:'Measures unconscious attitudes toward groups by measuring reaction times.'},
      {t:'Belief Perseverance', d:'Clinging to an idea even after it has been clearly refuted by evidence.'},
      {t:'Conformity', d:'Adjusting behavior or thinking to match group standards — demonstrated by Asch\'s line studies.', e:'Asch\'s line study: participants chose the obviously wrong line length to match the group\'s incorrect answer.'},
      {t:'Obedience', d:'Following direct orders from an authority figure — Milgram\'s shock experiment showed ~65% agreement rate.', e:'In Milgram\'s experiment, 65% of participants delivered what they believed to be maximum-voltage shocks when an authority figure ordered them to.'},
      {t:'Groupthink', d:'Pressure for conformity in cohesive teams leads to poor collective decisions by suppressing dissent.', e:'NASA engineers who privately doubted the Challenger launch safety stayed silent in the group meeting — pressure for consensus overrode honest dissent.'},
      {t:'Bystander Effect', d:'As number of witnesses increases, the likelihood any one individual will help DECREASES.', e:'Kitty Genovese was attacked while dozens of neighbors heard but did not call police — each assumed someone else would help.'},
      {t:'Diffusion of Responsibility', d:'Each person feels less responsible for helping when others are present.', e:'In a crowded elevator, no one helps someone who drops their groceries — everyone assumes someone else will act.'},
      {t:'Deindividuation', d:'Loss of identity awareness and individual accountability in crowds or anonymity — increases antisocial behavior.', e:'At an anonymous protest, an otherwise peaceful person starts vandalizing — the crowd reduces individual accountability.'},
      {t:'Social Loafing', d:'Individuals exert reduced exertion when working collectively than when working alone.', e:'A student does less work on a group project because they know others will compensate — reduced effort in a group.'},
      {t:'Social Facilitation', d:'Improved performance on simple/familiar tasks when others are watching; impaired on complex tasks.', e:'A cyclist rides faster in a race than alone because the presence of others enhances performance on a well-practiced task.'},
      {t:'Id', d:'Freud: the unconscious reservoir of primitive drives seeking immediate pleasure (pleasure principle).', e:'An infant\'s screaming for milk the moment they\'re hungry — immediate gratification of biological need, driven by this primal force.'},
      {t:'Ego', d:'Freud: the rational, conscious mediator that balances primal drives (id) and moral constraints; operates on the reality principle.', e:'You want to eat all the Halloween candy at once (id) but the reality-based mental layer intervenes: "Two pieces now, save the rest."'},
      {t:'Superego', d:'Freud: the internalized moral conscience representing societal standards and ideals.', e:'You return the extra change a cashier accidentally gave you — your internalized moral conscience overrides the temptation.'},
      {t:'Defense Mechanisms', d:'Unconscious tactics the ego uses to reduce anxiety: repression, denial, projection, rationalization, displacement, sublimation.', e:'A student who fails an exam says the test was "totally unfair and poorly written" — rationalization as an unconscious protective strategy.'},
      {t:'Projection', d:'Freudian defense: displacing one\'s own unacceptable feelings onto others.', e:'A person who secretly resents their friend accuses that friend of being jealous of them.'},
      {t:'Rationalization', d:'Freudian defense: fabricating plausible explanations to conceal true motives.', e:'"I deserved that second slice of cake; I worked hard today" — justifying the indulgence after the fact.'},
      {t:'Repression', d:'Freudian defense: forcing anxiety-provoking thoughts into the unconscious.', e:'A trauma survivor has no conscious memory of the abuse — it has been repressed from awareness.'},
      {t:'Sublimation', d:'Freudian defense: redirecting unacceptable impulses into socially acceptable activities.', e:'A person with aggressive impulses channels them into boxing — a socially acceptable outlet.'},
      {t:'Unconditional Positive Regard', d:'Rogers: accepting and valuing a person completely without conditions — key to humanistic therapy.', e:'A therapist listens without judgment to a client who has done something shameful — a core condition for growth in person-centered therapy.'},
      {t:'Self-Actualization', d:'Maslow\'s highest need — fulfilling one\'s full potential; the goal of humanistic therapy.', e:'An artist who gives up a lucrative career to pursue their passion fully is striving to fulfill their highest human potential.'},
      {t:'Big Five (OCEAN)', d:'Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism — the dominant scientific personality model.'},
      {t:'Openness', d:'Big Five trait: imaginative, curious, receptive to new experiences vs. conventional.', e:'A person who loves trying exotic cuisines, visiting museums, and exploring new ideas scores high on this Big Five trait.'},
      {t:'Conscientiousness', d:'Big Five trait: organized, disciplined, reliable — best predictor of job success and academic achievement.', e:'Always arriving early, keeping a detailed planner, and completing tasks ahead of deadlines reflects a high score on this Big Five trait.'},
      {t:'Extraversion', d:'Big Five trait: outgoing, talkative, energized by social interaction vs. introverted.', e:'An extrovert feels energized after a party and seeks out social events on weekends.'},

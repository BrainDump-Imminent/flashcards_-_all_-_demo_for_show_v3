      {t:'Agreeableness', d:'Big Five trait: cooperative, trusting, warm vs. antagonistic and suspicious.', e:'A nurse who is warm, compassionate, and cooperative with colleagues scores high on this Big Five trait.'},
      {t:'Neuroticism', d:'Big Five trait: tense, emotionally reactive, prone to mood swings vs. emotionally stable.', e:'A person who frequently feels anxious, irritable, and emotionally volatile scores high on this Big Five trait.'},
      {t:'Reciprocal Determinism', d:'Bandura: behavior, personal factors (thoughts, beliefs), and environment mutually influence each other.'},
      {t:'Hull\'s Homeostatic Motivation Model', d:'Biological needs create drives; behavior aims to reduce those drives and restore internal balance.'},
      {t:'Yerkes-Dodson Law', d:'Performance is best at moderate arousal; too little = boredom; too much = anxiety impairs performance.'},
      {t:'Intrinsic Motivation', d:'Engaging in an activity because it is naturally interesting or satisfying.'},
      {t:'Extrinsic Motivation', d:'Engaging in an activity to obtain outside rewards (grades, money, praise).'},
      {t:'Overjustification Effect', d:'External rewards for an intrinsically interesting activity can decrease intrinsic motivation.'},
      {t:'Hierarchy of Needs (Maslow)', d:'Physiological → Safety → Love/Belonging → Esteem → Self-Actualization. Lower levels must be satisfied first.'},
      {t:'James-Lange Theory', d:'We experience emotion because we notice our physiological response. "I feel afraid because I am trembling."'},
      {t:'Cannon-Bard Theory', d:'Physiological arousal and the subjective feeling of emotion occur simultaneously and independently.'},
      {t:'Two-Factor Theory (Schachter-Singer)', d:'Emotion = physiological arousal + a cognitive label. Same arousal can produce different emotions based on context.'},
      {t:'Facial-Feedback Hypothesis', d:'Our expressive features can influence the feelings we actually experience.'},
      {t:'Display Rules', d:'Cultural norms governing when and how feelings are shown — vary widely across cultures.'},
      {t:'Ekman\'s 6 Universal Emotions', d:'Anger, disgust, fear, happiness, sadness, surprise — recognized across all cultures.'},
      {t:'Altruism', d:'Unselfish regard for the welfare of others — helping without expectation of personal gain; increases with empathy and similarity.', e:'A stranger dives into a frozen river to save a drowning child at personal risk — with no expectation of reward.'},
      {t:'Aggression', d:'Any physical or verbal behavior intended to harm — influenced by biological factors, frustration, social learning, and media exposure.'},
      {t:'Frustration-Aggression Principle', d:'The obstructing of a goal creates anger that may trigger antagonistic behavior, especially when the goal is thwarted by an external agent.'},
      {t:'Foot-in-the-Door Technique', d:'Compliance strategy: securing a small initial commitment makes people more likely to agree to a larger request later — consistency pressure.', e:'After agreeing to sign a petition, you are more likely to later agree to volunteer time for the same cause.'},
      {t:'Door-in-the-Face Technique', d:'Compliance strategy: starting with a large request (refused) makes a smaller follow-up request seem more reasonable by contrast.', e:'A charity asks for a $500 donation; you decline; they ask for $20 — and you agree because $20 seems reasonable.'},
      {t:'Central Route Persuasion', d:'Viewpoint shift through careful analysis of arguments and evidence — produces lasting opinion change when motivation and ability are high.', e:'A voter reads a candidate\'s detailed policy proposals and changes their mind based on the logical arguments.'},
      {t:'Peripheral Route Persuasion', d:'Viewpoint shift through surface cues (attractiveness, credibility signals, emotional appeals) — superficial and short-lived.', e:'A consumer buys the shampoo endorsed by a celebrity rather than the one with better ingredients.'},
      {t:'Normative Social Influence', d:'Conforming to group behavior to gain approval or avoid rejection — driven by acceptance needs, not belief in the group.', e:'Everyone stands up when the performer enters the theater, so you stand up too — even if you are unsure why.'},
      {t:'Informational Social Influence', d:'Conforming because we trust others as a reliable source of knowledge in ambiguous situations — we genuinely believe they know better.', e:'You are new in town and everyone at the restaurant is eating with chopsticks, so you assume that is the correct utensil.'},
      {t:'Social Contagion', d:'The spread of moods, behaviors, and ideas through a group — laughter, panic, and fashion can be viral.', e:'During a stressful event, one person\'s panic spreads rapidly through a crowd, causing others to flee even without direct knowledge of the threat.'},
      {t:'Spotlight Effect', d:'The tendency to overestimate how much others notice and evaluate our appearance, mistakes, and behavior.', e:'You get a haircut and feel everyone is staring at it all day — in reality, most people have not noticed.'},
      {t:'Collective Unconscious (Jung)', d:"Jung's proposed shared reservoir of inherited memories and images common to all humanity — source of universal symbols (archetypes)."},
      {t:'Archetypes', d:'Jung: universal symbolic images and themes in the collective unconscious — the hero, shadow, anima/animus, and mother figure.', e:'The "wise old man" archetype appears in Gandalf, Dumbledore, and Yoda — universally recognized symbols from the collective unconscious.'},
      {t:'MMPI (Minnesota Multiphasic Personality Inventory)', d:'The most widely used standardized self-report measure — empirically keyed scales assess traits and psychopathology across clinical populations.', e:'A clinical psychologist uses this standardized measure to assess whether a client shows signs of depression, paranoia, or antisocial tendencies.'},
      {t:'Rorschach Projective Personality Assessment', d:'An ambiguous inkblot technique where free responses are interpreted to reveal unconscious drives and conflicts; criticized for low reliability and validity.', e:'A patient sees "a bat" in every inkblot — a clinician might interpret this as a preoccupation with darkness or threat.'},
      {t:'Murray\'s Picture Story Projective Assessment (TAT)', d:'An interpretive measurement approach: participants narrate stories about ambiguous scenes or illustrations — recurring themes reveal unconscious motives, conflicts, and needs.', e:'A client tells a story about a lonely man rejected by everyone — this may reveal unconscious feelings of social rejection.'},
      {t:'Arousal Theory', d:'People seek an optimal level of stimulation — too little causes boredom; too much causes anxiety. Yerkes-Dodson law describes the curve.', e:'Skydivers seek the thrill of jumping because they have a higher optimal stimulation level than most people.'},
      {t:'External Pull Motivation Theory', d:'Incentive model: environmental rewards and goals attract behavior — we act because of anticipated outcomes, not solely because of internal needs.', e:'A student who does not enjoy studying still does it because they want the college scholarship — an outside incentive drives behavior.'},
      {t:'Set Point (Hunger)', d:'The body weight the body actively defends — regulated by fat cell signaling, metabolic rate, and appetite hormones like leptin and ghrelin.', e:'After dieting, weight often returns to where it was — the body\'s biological target drives metabolism and appetite to restore its preferred weight.'},
      {t:'Binge-Eating Disorder', d:'Recurrent episodes of consuming large amounts of food rapidly without compensatory behaviors — the most common condition of its kind; associated with obesity and depression.', e:'A person eats an entire large pizza and two bags of chips in one sitting in secret, then feels intense shame — but no purging.'},
      {t:'Cognitive Appraisal (Lazarus)', d:'Emotion depends on how we consciously evaluate a situation — whether we judge it as a threat, loss, or challenge determines the emotional reaction.', e:'Two people in the same turbulent flight — one panics (threat evaluation) and one feels excited (challenge evaluation) — same event, different emotions.'},
      {t:'Polygraph', d:'A lie-detector measuring physiological arousal (heart rate, blood pressure, breathing, perspiration) — considered unreliable; cannot distinguish arousal types.', e:'A suspect shows elevated heart rate when asked about the crime — but an innocent nervous person could show the same response.'},
    ]
  },

  // ── UNIT 5: Mental & Physical Health ───────────────
  u5: {
    label:'Unit 5 — Mental & Physical Health', tag:'Unit 5', color:'#3daa6e',
    cards:[
      {t:'Health Psychology', d:'The study of how biological, mental, and social factors affect wellness and illness.', e:'A psychologist in this field studies why people with strong social support recover faster from surgery.'},
      {t:'General Adaptation Syndrome (GAS)', d:'Selye\'s 3-stage stress response: Alarm → Resistance → Exhaustion.', e:'An overworked nurse enters Alarm when a crisis hits, sustains high stress in Resistance for months, then collapses with illness (Exhaustion).'},
      {t:'Fight-Flight-Freeze Response', d:'Immediate physiological activation (sympathetic NS) when facing perceived threat.', e:'A deer in headlights becomes immobile, a rabbit bolts away, a cornered cat hisses and swipes — three survival reactions to threat.'},
      {t:'Eustress', d:'Positive, motivating pressure (e.g., excitement before a competition) — can enhance performance.', e:'An athlete\'s pre-game nervousness sharpens their focus and improves performance — beneficial stress that energizes rather than harms.'},
      {t:'Problem-Focused Coping', d:'Directly addressing the stressor to solve or change it.', e:'A student stressed about failing makes a study schedule, gets a tutor, and drops one activity to free up time.'},
      {t:'Palliative Stress Response Strategy', d:'Coping approach focused on managing the emotional toll of a situation that cannot be directly altered.', e:'A terminally ill patient cannot cure the disease but finds meaning through journaling and connecting with loved ones.'},
      {t:'Adverse Childhood Experiences (ACEs)', d:'Traumatic early-life events with long-lasting effects on physical and mental health outcomes.', e:'A child who experienced abuse, neglect, and household substance abuse has a higher ACE score and elevated risk of heart disease as an adult.'},
      {t:'Psychoneuroimmunology', d:'The study of how mental, brain-based, and bodily defense processes interact.', e:'Students get sick more often during finals week — chronic stress suppresses the immune system.'},
      {t:'Positive Psychology', d:'Seligman\'s approach: scientific study of what allows people to flourish — strengths, resilience, well-being.', e:'Instead of just treating depression, Seligman\'s PERMA model focuses on flourishing: emotion, engagement, relationships, meaning, and accomplishment.'},
      {t:'Resilience', d:'The ability to rebound from adversity, trauma, tragedy, or significant hardship.', e:'A child raised in poverty who becomes a successful professional through determination and support systems exemplifies the ability to bounce back from hardship.'},
      {t:'Posttraumatic Growth', d:'Beneficial personal transformation following struggle with highly challenging life circumstances.', e:'A cancer survivor says the illness gave them a new sense of purpose, deeper relationships, and gratitude for life.'},
      {t:'Gratitude', d:'Actively acknowledging the value of what one has — related interventions consistently increase well-being in research.', e:'Writing down three things you are thankful for each night increases well-being in controlled studies.'},
      {t:'DSM-5-TR', d:'American Psychiatric Association\'s manual for classifying mental disorders — the gold standard clinical reference.', e:'A clinician uses this diagnostic manual to confirm that a client\'s pattern of symptoms meets criteria for Major Depressive Disorder.'},
      {t:'Biopsychosocial Model', d:'Mental disorders arise from an interplay of bodily, cognitive, and cultural factors.', e:'Depression results from low serotonin (biological), negative thinking (psychological), and poverty/isolation (social) — all three must be addressed.'},
      {t:'Vulnerability-Trigger Disorder Framework', d:'Genetic predisposition combined with environmental stressors together produce psychological conditions — neither factor alone is sufficient.', e:'A person with a genetic risk for schizophrenia may never develop it unless they experience severe chronic stress.'},
      {t:'3 Criteria for Abnormality', d:'Dysfunction (impairs daily life), Distress (subjective suffering), Deviance (culturally unusual).', e:'A man washes his hands 200 times a day (deviance), cannot leave his house (dysfunction), and is in constant distress — meets all three standards for diagnosing a disorder.'},
      {t:'ADHD', d:'A neurodevelopmental condition marked by persistent difficulty sustaining focus and/or excessive restlessness and impulsivity that impairs daily functioning.', e:'A student cannot sit still during lectures, loses their assignments repeatedly, and acts impulsively — hallmark features of this disorder.'},
      {t:'ASD — Neurodevelopmental Communication Condition', d:'A lifelong developmental pattern marked by challenges in social interaction, atypical sensory responses, and restricted or repetitive behaviors.', e:'A child avoids eye contact, insists on the same daily routine, and has intense interest in train schedules but struggles with conversation.'},
      {t:'Schizophrenia', d:'Positive symptoms (delusions, hallucinations, disorganized thought) + Negative symptoms (flat affect, social withdrawal).', e:'A young man believes he is being monitored by aliens (delusion) and hears their voices giving commands (hallucination) — positive symptoms.'},
      {t:'Positive Symptoms (Schizophrenia)', d:'Experiences that are present but shouldn\'t be: delusions, hallucinations, disorganized thinking.', e:'Hearing voices that command you to act, or believing you are Napoleon — things present that should not be there.'},
      {t:'Negative Symptoms (Schizophrenia)', d:'Normal functions that are absent but should be present: flat affect, poverty of speech, withdrawal.', e:'A patient sits motionless for hours, speaks in monotone, and shows no facial expression — a deficit cluster typical of this psychotic disorder.'},
      {t:'Dopamine Hypothesis', d:'Excess activity of a key reward-pathway neurotransmitter is linked to the positive symptoms of schizophrenia.', e:'Drugs that block this neurotransmitter\'s receptors (antipsychotics) reduce hallucinations and delusions in schizophrenia.'},
      {t:'Major Depressive Disorder', d:'5+ characteristic symptoms for 2+ weeks: persistent low mood, loss of interest, fatigue, hopelessness, thoughts of death.', e:'For six weeks, a woman sleeps 12 hours a day, loses interest in hobbies, and repeatedly thinks life is not worth living.'},
      {t:'Bipolar Disorder', d:'Cycling between manic episodes (elevated mood, impulsivity) and depressive episodes.', e:'A man spends his life savings in 3 days on a business idea while barely sleeping (mania), then crashes into weeks of crippling depression.'},
      {t:'Anhedonia', d:'Inability to feel enjoyment or joy — a core feature of major depression.', e:'A once-passionate guitarist finds no joy in playing music during a depressive episode.'},
      {t:'Generalized Anxiety Disorder (GAD)', d:'Chronic, unfocused excessive apprehension lasting 6+ months about multiple areas of life.', e:'A student worries excessively about grades, family health, finances, and friendships — constant, unfocused worry persisting for over a year.'},
      {t:'Panic Disorder', d:'Recurrent unexpected surges of overwhelming dread + persistent concern about future episodes.', e:'A woman suddenly feels her heart racing, cannot breathe, and is convinced she is dying — an acute terror episode; she lives in dread of the next one.'},
      {t:'Social Anxiety Disorder', d:'Marked dread of interpersonal or performance situations where one might be scrutinized or embarrassed.', e:'A student refuses to raise their hand in class or eat in the cafeteria for fear of embarrassing themselves in front of peers.'},
      {t:'Specific Phobia', d:'Intense, irrational dread of a particular object or situation that is out of proportion to actual danger.', e:'A person who was bitten by a dog as a child now breaks into a cold sweat whenever they hear a dog bark.'},
      {t:'OCD', d:'Recurring intrusive thoughts generate distress → ritual-like acts temporarily ease that distress → the cycle perpetuates itself.', e:'A student must tap the doorknob 7 times before entering a room — if interrupted, she must start over to prevent a feared irrational catastrophe.'},
      {t:'PTSD', d:'Flashbacks, nightmares, hyperarousal, and avoidance behaviors that emerge following an overwhelming frightening event.', e:'A combat veteran dives under a table when a car backfires, has recurring nightmares about combat, and avoids crowded spaces.'},
      {t:'Anorexia Nervosa', d:'Severely restricted eating, intense fear of gaining weight, distorted body image. Highest mortality rate of any psychological disorder.', e:'A 90-lb teenage girl refuses to eat more than 400 calories a day and still sees herself as "fat" in the mirror.'},
      {t:'Bulimia Nervosa', d:'Binge eating followed by compensatory behaviors (purging, fasting, excessive exercise).', e:'A college student eats an entire box of cereal, three sandwiches, and a carton of ice cream in one sitting, then forces herself to vomit.'},
      {t:'Antisocial Personality Disorder', d:'Pervasive pattern of disregard for rights of others, deceit, impulsivity — no remorse.', e:'A con artist swindles elderly people out of their savings and feels no guilt — he sees them as "marks," not victims.'},
      {t:'Borderline Personality Disorder', d:'Instability in relationships, self-image, emotions, and marked impulsivity.', e:'A young woman swings from idealizing her therapist to devaluing them ("I hate you") within the same week.'},
      {t:'Systematic Desensitization', d:'Behavioral therapy for excessive fears: construct an anxiety hierarchy, then pair each level with a calming response (counterconditioning).', e:'A person with a spider phobia first learns relaxation, then imagines a distant spider, then views photos, then a spider in a jar — paired with relaxation.'},
      {t:'CBT (Cognitive-Behavioral Therapy)', d:'A structured approach that combines reshaping thought patterns with action-based practice — gold standard for mood and worry-based conditions.', e:'A depressed patient identifies the thought "I am worthless" and examines evidence for and against it, then creates a more balanced belief.'},
      {t:'DBT (Dialectical Behavior Therapy)', d:'CBT variant for borderline PD; balances acceptance and change through mindfulness and skills training.', e:'A patient with BPD learns mindfulness and emotional regulation skills to better manage intense emotions and impulsive reactions.'},
      {t:'Person-Centered Therapy (Rogers)', d:'Humanistic approach: unconditional positive regard, empathy, and active listening to facilitate growth.', e:'A therapist reflects, "It sounds like you feel completely unheard at home," without judgment or advice — creating a safe space.'},
      {t:'Free Association', d:'Freudian technique: verbalize any spontaneous thought or image to uncover unconscious material.', e:'The analyst says "mother" and the patient immediately says "guilt" — the therapist explores this uncensored verbal link.'},
      {t:'Cognitive Triad (Beck)', d:'Negative views of SELF, WORLD, and FUTURE — a constellation of pessimistic perspectives linked to depression.', e:'A depressed patient thinks: "I am a failure" (self), "Nothing ever works out" (world), "Things will never get better" (future).'},
      {t:'SSRIs', d:'A class of antidepressants that prevent a mood-regulating neurotransmitter from being reabsorbed at the synapse, boosting its availability. Take 2–4 weeks to reach full effect.', e:'Fluoxetine (Prozac) blocks serotonin reuptake; patients often feel better after 2–4 weeks of daily use.'},
      {t:'Antipsychotics', d:'Dopamine antagonists reducing positive symptoms of schizophrenia. Risk: tardive dyskinesia with long-term use.', e:'Haloperidol blocks dopamine receptors — it reduces hallucinations in schizophrenia but risks tardive dyskinesia with long-term use.'},
      {t:'Lithium', d:'Mood stabilizer for bipolar disorder; narrows mood swings. Requires careful monitoring due to narrow therapeutic window.', e:'A patient with bipolar disorder takes this mood-stabilizing mineral daily to prevent both manic highs and depressive lows — blood levels must be monitored carefully.'},
      {t:'ECT (Electroconvulsive Therapy)', d:'Induced neural convulsions under anesthesia — highly effective for severe, drug-resistant persistent low mood.', e:'A patient with severe depression who did not respond to four antidepressants receives ECT and shows dramatic improvement within weeks.'},
      {t:'TMS (Transcranial Magnetic Stimulation)', d:'A non-invasive brain procedure using pulsed energy fields to modulate cortical activity — fewer side effects than ECT; used for treatment-resistant depression.', e:'A depressed patient receives daily non-invasive brain sessions — pulsed energy targets the prefrontal cortex without ECT\'s memory side effects.'},
      {t:'Point-Exchange Behavioral Reward System', d:'An operant therapy technique: tokens earned for target actions that can later be traded in for preferred items or freedoms.', e:'A psychiatric ward gives patients tokens for making their beds and attending therapy; tokens can be redeemed for TV time or snacks.'},
      {t:'Confidentiality', d:'Therapists keep client information private — except when there is danger of harm to self or others.', e:'A therapist does not share client information with the employer — but this ethical duty yields when the client reveals a plan to harm their roommate.'},
      {t:'Nonmaleficence', d:'APA ethical principle: "do no harm" — therapists must avoid actions that could harm clients.', e:'A therapist avoids dual relationships (such as dating a client) because this could harm the client.'},
      {t:'Type A / Type B Behavior', d:'Pattern A: competitive, impatient, hostile — higher risk of coronary heart disease. Pattern B: relaxed, easygoing, less cardiovascular risk.', e:'An impatient executive becomes furious in traffic and works 80-hour weeks; a relaxed teacher takes a leisurely lunch and rarely raises their voice — contrasting personality styles.'},
      {t:'Psychosomatic', d:'Physical symptoms caused or worsened by mental and emotional factors such as stress — the illness is real, not imaginary.', e:'A student gets severe headaches every Monday before a difficult class — stress is triggering a real physical symptom.'},
      {t:'Coronary Heart Disease', d:'The leading cause of death in the US; stress, Type A hostility, and poor health behaviors are significant psychological contributors.', e:'A hostile, high-stress businessman suffers a myocardial infarction at 52 — chronic anger and pressure take a physical toll on the cardiovascular system.'},
      {t:'Aerobic Exercise', d:'Sustained physical activity that elevates heart rate — research-supported antidepressant and stress reducer; improves mood and cognition.', e:'Running for 30 minutes three times a week has been shown to reduce depression symptoms comparably to antidepressant medication.'},
      {t:'Mindfulness Meditation', d:'Directing full, accepting attention to present-moment experience — consistently reduces stress, low mood, and chronic pain.', e:'An app guides users to focus on breathing for 10 minutes — regular practice reduces cortisol levels and anxiety in controlled studies.'},
      {t:'Flow (Csikszentmihalyi)', d:'A state of total absorption in a challenging but manageable task — time distorts, intrinsic motivation peaks, and self-consciousness disappears.', e:'A programmer so absorbed in debugging code that she looks up and three hours have passed without noticing.'},
      {t:'Rosenhan Study', d:'"On Being Sane in Insane Places" (1973): pseudopatients admitted to hospitals; staff failed to detect sanity — revealed dangers of diagnostic labeling.', e:'Healthy pseudopatients admitted to psychiatric hospitals had their behaviors (like note-taking) interpreted as symptoms — staff never detected they were sane.'},
      {t:'Diagnostic Labeling', d:'Assigning a diagnosis can create stigma, distort perception (seeing symptoms that confirm the classification), but also enables treatment and research.', e:'Once diagnosed with schizophrenia, a patient\'s laughter is noted as \'inappropriate affect\' — the label filters how clinicians interpret everything.'},
      {t:'Dissociative Identity Disorder (DID)', d:'Two or more distinct personality states that alternately control behavior — formerly called multiple personality condition; linked to severe childhood trauma.', e:'A client switches between a timid child-like state and an angry adult state during therapy, with no memory of what the other "alter" said.'},
      {t:'Dissociative Amnesia', d:'Sudden loss of access to important personal history — typically following a distressing event; not due to organic brain damage.', e:'A soldier returns from combat with no memory of a traumatic firefight — the memory is blocked without any brain injury.'},
      {t:'Medically Unexplained Physical Distress Condition', d:'One or more bodily complaints causing significant impairment but lacking a sufficient clinical explanation — formerly called somatoform disorder.', e:'A patient visits multiple specialists for chest pain and fatigue; all tests return normal — but the suffering and functional impairment are very real.'},
      {t:'Narcissistic Personality Disorder', d:'Cluster B: inflated self-importance, need for admiration, lack of empathy, and exploitative relationships.', e:'A CEO demands constant admiration, exaggerates achievements, and exploits employees without empathy — a Cluster B character pattern.'},
      {t:'Exposure Therapy', d:'A behavioral technique that gradually confronts clients with feared objects or situations until distress extinguishes — gold standard for excessive fears and PTSD.', e:'A veteran with PTSD is gradually exposed to combat sounds in a controlled setting until the anxiety response diminishes.'},
      {t:'EMDR (Eye Movement Desensitization & Reprocessing)', d:'Therapist guides bilateral sensory stimulation (typically rhythmic ocular tracking) while the client revisits traumatic memories — reduces emotional reactivity; growing evidence base for PTSD.', e:'A therapist moves a finger back and forth while the trauma survivor recalls a car accident — reported to reduce the emotional charge of the memory.'},
      {t:'Psychodynamic Therapy', d:'Modern descendant of classical analytic treatment — shorter and more focused; explores how unconscious processes and past relationships shape current problems.', e:'A therapist helps a client see how their pattern of picking unavailable partners mirrors their relationship with a cold, distant parent.'},
      {t:'Transference', d:'In psychoanalytic therapy, the client displaces emotions felt toward past figures (parents) onto the therapist — examined to reveal unconscious conflicts.', e:'A client begins treating their therapist with the same resentment they felt toward an abusive father — examined as therapeutic material.'},
      {t:'Resistance', d:'In psychoanalysis, unconscious blocking of anxiety-provoking material from reaching awareness — seen as a defense against insight.', e:'A client suddenly "forgets" appointments whenever sessions move toward a painful childhood topic.'},
      {t:'Active Listening', d:"Rogers' technique of empathically reflecting feelings back without judgment — creates unconditional positive regard and conditions for growth."},
      {t:'Antidepressants', d:'Medications for persistent low mood: SSRIs block serotonin reabsorption; SNRIs block serotonin + norepinephrine; take 2–4 weeks for full effect.', e:'A patient with depression takes an SSRI for 6 weeks and notices improved mood, energy, and motivation as the drug reaches therapeutic levels.'},
      {t:'Benzodiazepines', d:'Fast-acting calming agents (Xanax, Valium) that enhance GABA — effective quickly but risk dependence and withdrawal; used short-term.', e:'A patient with severe panic disorder takes Xanax as needed — it works quickly, but daily use leads to tolerance and dependency.'},
      {t:'Tardive Dyskinesia', d:'Involuntary repetitive movements (especially of face/tongue) — serious side effect of long-term conventional antipsychotic use.', e:'After years of conventional antipsychotic use, a patient develops involuntary lip-smacking and tongue rolling.'},
      {t:'Deinstitutionalization', d:'1960s–70s shift from large psychiatric hospitals to community care — driven by new drugs and civil rights concerns; increased homelessness as unintended consequence.', e:'In the 1970s, large psychiatric hospitals discharged hundreds of thousands of patients; without community support, many ended up homeless.'},
      {t:'Meichenbaum\'s Cognitive Coping Rehearsal', d:'CBT technique: clients learn and practice adaptive self-talk statements to manage future stressors — preparing the mind the way vaccines prepare the immune system.', e:'Before a difficult surgery, a patient rehearses calming self-statements: "This will be uncomfortable but manageable; I\'ve handled hard things before."'},
      {t:'Evidence-Based Practice', d:'Integrating the best available scientific findings with clinical expertise and patient preferences to guide therapeutic decisions — the gold standard in mental health care.', e:'A therapist chooses CBT for a client with OCD because meta-analyses consistently show it is more effective than other approaches for this condition.'},
    ]
  },

  // ── MASTER DECK: All Units ─────────────────────────
  all: { label:'All Units — Master Deck', tag:'All Units', color:'#1a1828', _master:true },

  // ── EXAMPLE DECKS (Term → Example) ─────────────────
  u0_ex: { label:'Unit 0 — Research Methods', tag:'Unit 0', color:'#9490a8', _exDeck:true, _srcKey:'u0' },
  u1_ex: { label:'Unit 1 — Biological Bases', tag:'Unit 1', color:'#22D3EE', _exDeck:true, _srcKey:'u1' },
  u2_ex: { label:'Unit 2 — Learning & Behavior', tag:'Unit 2', color:'#00b3a4', _exDeck:true, _srcKey:'u2' },
  u3_ex: { label:'Unit 3 — Cognition', tag:'Unit 3', color:'#f0A500', _exDeck:true, _srcKey:'u3' },
  u4_ex: { label:'Unit 4 — Development, Social & Personality', tag:'Unit 4', color:'#e0513a', _exDeck:true, _srcKey:'u4' },
  u5_ex: { label:'Unit 5 — Mental & Physical Health', tag:'Unit 5', color:'#3daa6e', _exDeck:true, _srcKey:'u5' },
  all_ex: { label:'All Units — Examples Master Deck', tag:'All Units', color:'#1a1828', _exDeck:true, _master:true }
};

// Build master deck lazily; example decks swap d↔e so all study modes work transparently
function getFcCards(deckId) {
  const deck = FC_DECKS[deckId];
  if (!deck) return [];

  // Helper: convert a card to example mode (back = example instead of definition)
  function toExCard(c) {
    if (!c.e) return null; // skip cards without examples
    return { t: c.t, d: c.e, _origDef: c.d }; // d becomes the example
  }

  if (deckId === 'all') {
    return Object.entries(FC_DECKS)
      .filter(([k]) => k !== 'all' && !FC_DECKS[k]._exDeck)
      .flatMap(([,d]) => d.cards);
  }
  if (deckId === 'all_ex') {
    return Object.entries(FC_DECKS)
      .filter(([k]) => k !== 'all' && !FC_DECKS[k]._exDeck)
      .flatMap(([,d]) => d.cards)
      .map(toExCard).filter(Boolean);
  }
  if (deck._exDeck && deck._srcKey) {
    return (FC_DECKS[deck._srcKey]?.cards || []).map(toExCard).filter(Boolean);
  }
  return deck.cards || [];
}

<script>
// ── FLASHCARD APP STATE ──────────────────────────────
let fcCurrentDeck = null;
let fcCards = [];
let fcQueue = [];
let fcIndex = 0;
let fcKnown = [];
let fcMissed = [];
let fcMode = 'browse';
let fcFlipped = false;
let fcMatchSel = null;
let fcMatchMatched = 0;
let fcMatchTimer = null;
let fcMatchStart = null;
let fcMatchUsedCards = [];  // Track cards used across match rounds
let fcMCQIndex = 0;
let fcMCQScore = 0;
let fcMCQAnswered = false;
let fcMCQAnsweredWrong = false;
let fcInited = false;
let fcIncorrectPile = [];  // ← Cards marked as incorrect from Match & MCQ modes

function initFlashcards() {
  if (!fcInited) {
    renderFCHome();
    fcInited = true;
  }
}

function renderFCHome() {
  const fv = document.getElementById('flashcards-view');
  if (!fv) return;
  fv.innerHTML = '';

  // Home
  const home = document.createElement('div');
  home.id = 'fc-home';

  const unitGroups = [
    { label: 'Term → Definition', subtitle: 'Classic flashcard study', keys: ['u0','u1','u2','u3','u4','u5'], masterKey: 'all' },
    { label: 'Term → Example', subtitle: 'Real-world application practice', keys: ['u0_ex','u1_ex','u2_ex','u3_ex','u4_ex','u5_ex'], masterKey: 'all_ex', isExample: true }
  ];

  function getDeckCount(k) {
    const d = FC_DECKS[k];
    if (k === 'all') return Object.entries(FC_DECKS).filter(([kk])=>!FC_DECKS[kk]._exDeck && kk!=='all').reduce((s,[,dd])=>s+dd.cards.length,0);
    if (k === 'all_ex') return Object.entries(FC_DECKS).filter(([kk])=>!FC_DECKS[kk]._exDeck && kk!=='all').reduce((s,[,dd])=>s+(dd.cards||[]).filter(c=>c.e).length,0);
    if (d._exDeck && d._srcKey) return (FC_DECKS[d._srcKey]?.cards||[]).filter(c=>c.e).length;
    return (d.cards||[]).length;
  }

  home.innerHTML = `
    <div class="fc-home-header">
      <div class="fc-home-title">🃏 AP Psychology Flashcards</div>
      <div class="fc-home-sub">Choose a deck to study — Browse, Learn, Match, or MCQ modes</div>
    </div>
    ${unitGroups.map(g => `
      <div class="fc-unit-section">
        <div class="fc-unit-label" style="display:flex;align-items:center;gap:10px">
          ${g.label}${g.isExample ? ' <span style="font-size:0.95rem;background:#f0fdf4;color:#3daa6e;border:1px solid #bbf7d0;padding:2px 8px;border-radius:10px;font-family:var(--font-mono);font-weight:700">Real-world examples</span>' : ''}
        </div>
        <div style="font-size:0.98rem;color:var(--text3);margin-bottom:8px;margin-top:-2px">${g.subtitle}</div>
        <div class="fc-deck-grid">
          ${g.keys.map(k => {
            const d = FC_DECKS[k];
            const count = getDeckCount(k);
            return `<button class="fc-deck-btn" onclick="fcLoadDeck('${k}')" style="border-color:${d.color}22${g.isExample ? ';border-style:dashed' : ''}">
              <div class="fc-deck-tag" style="background:${d.color}18;color:${d.color}">${d.tag}</div>
              <div class="fc-deck-name">${d.label}</div>
              <div class="fc-deck-count">${count} terms${g.isExample ? ' · examples' : ''}</div>
            </button>`;
          }).join('')}
          <button class="fc-deck-btn" onclick="fcLoadDeck('${g.masterKey}')" style="border-color:#1a182822${g.isExample ? ';border-style:dashed' : ''}">
            <div class="fc-deck-tag" style="background:#1a182818;color:#1a1828">All Units</div>
            <div class="fc-deck-name">${g.isExample ? 'All Units — Examples Master Deck' : 'All Units — Master Deck'}</div>
            <div class="fc-deck-count">${getDeckCount(g.masterKey)} terms${g.isExample ? ' · examples' : ''}</div>
          </button>
        </div>
      </div>
    `).join('')}
  `;

  fv.appendChild(home);
}

function fcLoadDeck(deckId) {
  fcCurrentDeck = deckId;
  if(FC_DECKS[deckId]) tmrSetContext('flashcards:' + deckId, FC_DECKS[deckId].label);
  fcCards = getFcCards(deckId).map(c => ({...c}));
  fcQueue = shuffle([...fcCards]);
  fcIndex = 0; fcKnown = []; fcMissed = [];
  fcIncorrectPile = [];  // ← Reset incorrect pile when loading new deck
  fcMatchUsedCards = [];  // ← Reset match history for new deck
  fcMCQUsedCards = [];    // ← Reset MCQ history for new deck
  fcUpdateIncorrectBadge();  // ← Show badge if pile has items from previous deck
  renderFCStudy();
  fcSetMode('browse');
}

function fcIsExampleDeck() {
  return !!(FC_DECKS[fcCurrentDeck]?._exDeck);
}

function renderFCStudy() {

        <div class="fc-mode-tabs">
          <button class="fc-mode-btn active" id="fcbtn-browse" onclick="fcSetMode('browse')">📋 Browse</button>

          <button class="fc-mode-btn" id="fcbtn-match" onclick="fcSetMode('match')">⚡ Match</button>
          <button class="fc-mode-btn" id="fcbtn-mcq" onclick="fcSetMode('mcq')">📝 MCQ</button>
          <button class="fc-mode-btn" id="fcbtn-incorrect" onclick="fcSetMode('incorrect')">📚 Pile <span id="fc-pile-badge" style="margin-left:4px;font-size:0.95rem;background:rgba(229,62,62,0.2);color:#dc2626;padding:1px 6px;border-radius:6px;display:none">0</span></button>
        </div>
        <button class="fc-back-btn" onclick="fcGoHome()">← Decks</button>
      </div>
      <!-- Browse -->
      <div id="fc-browse">
        <div class="fc-search-wrap">
          <span class="fc-search-icon">🔍</span>
          <input id="fc-search" type="text" placeholder="Search terms or ${isEx ? 'examples' : 'definitions'}…" oninput="fcRenderBrowse(this.value)">
        </div>
        <div id="fc-count-badge" class="fc-count-badge"></div>
        <div id="fc-list"></div>
      </div>
      <!-- Learn -->
      <div id="fc-learn">
        <div class="fc-progress-wrap">
          <div class="fc-prog-track"><div class="fc-prog-bar" id="fc-prog" style="background:${FC_DECKS[fcCurrentDeck].color}"></div></div>
          <span class="fc-prog-label" id="fc-prog-label">0 / 0</span>
        </div>
        <div class="fc-card-wrap" id="fc-card" onclick="fcFlip()">
          <div class="fc-card-inner">
            <div class="fc-card-face">
              <div class="fc-card-label">Term</div>
              <div class="fc-card-term" id="fc-term"></div>
            </div>
            <div class="fc-card-face fc-card-back-face">
              <div class="fc-card-label" id="fc-back-label">${backLabel}</div>
              <div class="fc-card-def" id="fc-def"></div>
            </div>
          </div>
        </div>
        <div class="fc-flip-hint">Click card or press Space to flip &nbsp;·&nbsp; → Got it &nbsp;·&nbsp; ← Missed</div>
        <div class="fc-learn-btns" id="fc-learn-btns">
          <button class="fc-learn-btn fc-btn-miss" onclick="fcMark(false)">✕ Missed</button>
          <button class="fc-learn-btn fc-btn-got" onclick="fcMark(true)">✓ Got it</button>
        </div>
        <div id="fc-result">
          <div class="fc-result-title">Round complete!</div>
          <div class="fc-stats">
            <div class="fc-stat good"><div class="sn" id="fc-r-got">0</div><div class="sl">Got it</div></div>
            <div class="fc-stat miss"><div class="sn" id="fc-r-miss">0</div><div class="sl">Missed</div></div>
          </div>
          <div class="fc-result-btns">
            <button class="fc-r-btn primary" onclick="fcRestartAll()">🔄 All cards again</button>
            <button class="fc-r-btn" id="fc-r-missed-btn" onclick="fcRestartMissed()">✕ Study missed only</button>
          </div>
        </div>
      </div>
      <!-- Match -->
      <div id="fc-match">
        <div class="fc-match-header">
          <div>
            <div style="font-size:1.08rem;color:#555;font-weight:500;margin-bottom:6px" id="fc-match-status">${matchStatus}</div>
            <div style="display:flex;align-items:center;gap:8px;font-size:1.02rem;color:#666">
              Pairs: <select id="fc-match-size" style="padding:4px 8px;border-radius:7px;border:1px solid #d0cfd6;background:#fff;font-size:1.02rem" onchange="fcSetupMatch()">
                <option value="4">4</option><option value="6" selected>6</option><option value="8">8</option><option value="10">10</option>
              </select>

            <button class="fc-r-btn primary" onclick="fcStartMatch()">Start</button>
          </div>
        </div>
        <div class="fc-match-grid" id="fc-match-grid"></div>
        <div id="fc-match-done" class="fc-match-done" style="display:none">
          <h3>🎉 All matched!</h3><p id="fc-match-time-result"></p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <button class="fc-r-btn primary" id="fc-match-continue-btn" onclick="fcStartMatch(true)" style="display:none">▶ Continue</button>
            <button class="fc-r-btn" onclick="fcStartMatch()">🔄 Restart</button>
          </div>
        </div>
      </div>
      <!-- MCQ -->
      <div id="fc-mcq">
        <div id="fc-mcq-range-picker" style="max-width:580px;margin:0 auto;padding:14px 0">
          <div style="font-size:1.12rem;font-weight:700;color:var(--text);margin-bottom:4px">📝 Choose Card Range</div>

function fcGoHome() {
  if (fcMatchTimer) { clearInterval(fcMatchTimer); fcMatchTimer = null; }
  renderFCHome();
}

function fcSetMode(mode) {
  fcMode = mode;
  ['browse','learn','match','mcq','incorrect'].forEach(m => {
    const el = document.getElementById('fc-'+m);
    const btn = document.getElementById('fcbtn-'+m);
    if (el) el.style.display = m === mode ? 'block' : 'none';
    if (btn) btn.classList.toggle('active', m === mode);
  });
  if (mode === 'browse') fcRenderBrowse('');
  if (mode === 'learn') fcStartLearn();
  if (mode === 'match') fcSetupMatch();
  if (mode === 'mcq') fcStartMCQ();
  if (mode === 'incorrect') fcRenderIncorrectPile();
}

function fcRenderBrowse(filter) {
  const q = (filter||'').toLowerCase();
  const isEx = fcIsExampleDeck();
  const filtered = q ? fcCards.filter(c => c.t.toLowerCase().includes(q) || c.d.toLowerCase().includes(q)) : fcCards;
  const badge = document.getElementById('fc-count-badge');
  const list = document.getElementById('fc-list');
  if (badge) badge.textContent = filtered.length + ' / ' + fcCards.length + ' terms';
  if (list) list.innerHTML = filtered.map(c => {
    const backLabel = isEx ? 'Example' : 'Definition';
    const backStyle = isEx
      ? 'color:#2d7a4f;background:#f0fdf4;padding:8px 10px;border-radius:7px;border:1px solid #d1fae5;margin-top:4px;line-height:1.55'
      : '';
    return `<div class="fc-term-row">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div class="fc-term-word">${esc(c.t)}</div>
        <div style="font-size:0.82rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;font-family:var(--font-mono);white-space:nowrap;flex-shrink:0">${backLabel}</div>
      </div>
      <div class="fc-term-def" style="${backStyle}">${esc(c.d)}</div>

}

// ── LEARN MODE ─────────────────────────────────────────
function fcStartLearn() {
  fcQueue = shuffle([...fcCards]);
  fcIndex = 0; fcKnown = []; fcMissed = []; fcFlipped = false;
  const card = document.getElementById('fc-card');
  if (card) card.classList.remove('flipped');
  const res = document.getElementById('fc-result');
  if (res) res.style.display = 'none';
  const btns = document.getElementById('fc-learn-btns');
  if (btns) btns.style.display = 'flex';
  fcShowCard();
}

function fcShowCard() {
  const prog = document.getElementById('fc-prog');
  const label = document.getElementById('fc-prog-label');
  const total = fcQueue.length;
  const done = fcIndex;
  if (prog) prog.style.width = total ? (done/total*100)+'%' : '0%';
  if (label) label.textContent = done + ' / ' + total;
  if (fcIndex >= fcQueue.length) { fcShowResult(); return; }
  const c = fcQueue[fcIndex];
  const termEl = document.getElementById('fc-term');
  const defEl = document.getElementById('fc-def');
  if (termEl) termEl.textContent = c.t;
  if (defEl) defEl.textContent = c.d;
  fcFlipped = false;
  const card = document.getElementById('fc-card');
  if (card) card.classList.remove('flipped');
}

function fcFlip() {
  fcFlipped = !fcFlipped;
  const card = document.getElementById('fc-card');
  if (card) card.classList.toggle('flipped', fcFlipped);
}

function fcMark(knew) {
  if (!fcFlipped) { fcFlip(); return; }
  if (knew) fcKnown.push(fcQueue[fcIndex]);
  else fcMissed.push(fcQueue[fcIndex]);
  fcIndex++;
  fcShowCard();
}

function fcShowResult() {
  const res = document.getElementById('fc-result');
  const btns = document.getElementById('fc-learn-btns');
  const prog = document.getElementById('fc-prog-label');
  if (res) res.style.display = 'block';
  if (btns) btns.style.display = 'none';
  if (prog) prog.textContent = fcQueue.length + ' / ' + fcQueue.length;
  const got = document.getElementById('fc-r-got');
  const miss = document.getElementById('fc-r-miss');
  const mb = document.getElementById('fc-r-missed-btn');
  if (got) got.textContent = fcKnown.length;
  if (miss) miss.textContent = fcMissed.length;
  if (mb) mb.style.display = fcMissed.length ? 'inline-block' : 'none';
  // THE CURVE: record flashcard session score
  const _fcTotal = fcKnown.length + fcMissed.length;
  const _fcPct   = _fcTotal > 0 ? Math.round((fcKnown.length / _fcTotal) * 100) : 0;
  if (fcCurrentDeck && fcCurrentDeck !== 'all') {
    UNITS_DATA.forEach(function(u) {
      if ('u'+u.num === fcCurrentDeck || u.id === fcCurrentDeck) {
        u.topics.forEach(function(t) { if(isTopicDone(u.id,t.id)) crvRecordReview(u.id,t.id,_fcPct); });
      }
    });
  }
}

function fcRestartAll() {
  const res = document.getElementById('fc-result');
  if (res) res.style.display = 'none';
  fcStartLearn();
}

function fcRestartMissed() {
  const res = document.getElementById('fc-result');
  if (res) res.style.display = 'none';
  if (!fcMissed.length) return;
  fcQueue = shuffle([...fcMissed]);
  fcIndex = 0; fcKnown = []; fcMissed = []; fcFlipped = false;
  const btns = document.getElementById('fc-learn-btns');
  if (btns) btns.style.display = 'flex';
  fcShowCard();
}

// ── MATCH MODE ─────────────────────────────────────────
function fcSetupMatch() {
  const done = document.getElementById('fc-match-done');
  if (done) done.style.display = 'none';
  const grid = document.getElementById('fc-match-grid');
  if (grid) grid.innerHTML = '<div style="color:#888;font-size:1.06rem;padding:12px">Press Start to begin matching</div>';
  const timer = document.getElementById('fc-match-timer');
  if (timer) timer.textContent = '';
  if (fcMatchTimer) { clearInterval(fcMatchTimer); fcMatchTimer = null; }
}

function fcStartMatch(continueMode) {
  const n = parseInt(document.getElementById('fc-match-size')?.value||6);
  if (!continueMode) fcMatchUsedCards = [];  // Fresh start resets history
  const usedTerms = new Set(fcMatchUsedCards.map(c => c.t));
  const remaining = fcCards.filter(c => !usedTerms.has(c.t));
  const pick = Math.min(n, remaining.length);
  if (pick === 0) { fcMatchUsedCards = []; return fcStartMatch(); }  // All used, auto-restart
  const pool = shuffle([...remaining]).slice(0, pick);
  pool.forEach(c => fcMatchUsedCards.push(c));  // Mark these as used
  fcMatchSel = null; fcMatchMatched = 0;
  if (fcMatchTimer) { clearInterval(fcMatchTimer); fcMatchTimer = null; }
  fcMatchStart = Date.now();
  fcMatchTimer = setInterval(() => {
    const t = document.getElementById('fc-match-timer');
    if (t) { const s=Math.floor((Date.now()-fcMatchStart)/1000); t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  }, 500);

  const done = document.getElementById('fc-match-done');
  if (done) done.style.display = 'none';

  const items = shuffle([
    ...pool.map((c,i) => ({id:i, kind:'term', text:c.t, pair:i})),
    ...pool.map((c,i) => ({id:i+pick, kind:'def',  text:c.d, pair:i}))
  ]);

  const grid = document.getElementById('fc-match-grid');
  if (!grid) return;
  grid.innerHTML = items.map(item =>
    `<div class="fc-match-card" id="fcm-${item.id}" data-pair="${item.pair}" data-kind="${item.kind}" onclick="fcMatchClick(this)">${esc(item.text)}</div>`
  ).join('');

  const status = document.getElementById('fc-match-status');
  if (status) status.textContent = `Match ${pick} terms with their definitions`;
}

function fcMatchClick(el) {
  if (el.classList.contains('matched')) return;
  // Remove wrong state from any previous failed attempt
  document.querySelectorAll('.fc-match-card.wrong').forEach(c => c.classList.remove('wrong'));
  if (fcMatchSel === el) { el.classList.remove('sel'); fcMatchSel = null; return; }
  if (fcMatchSel) {
    const a = fcMatchSel, b = el;
    a.classList.remove('sel');
    if (a.dataset.pair === b.dataset.pair && a.dataset.kind !== b.dataset.kind) {
      a.classList.add('matched'); b.classList.add('matched');
      fcMatchSel = null; fcMatchMatched++;
      const total = document.querySelectorAll('.fc-match-card').length / 2;
      if (fcMatchMatched === total) {
        clearInterval(fcMatchTimer); fcMatchTimer = null;
        const s = Math.floor((Date.now()-fcMatchStart)/1000);
        const done = document.getElementById('fc-match-done');
        const t = document.getElementById('fc-match-time-result');
        if (t) t.textContent = `Completed in ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}!`;
        if (done) done.style.display = 'block';
        // Show/hide continue button
        const usedTerms = new Set(fcMatchUsedCards.map(c => c.t));
        const rem = fcCards.filter(c => !usedTerms.has(c.t)).length;
        const contBtn = document.getElementById('fc-match-continue-btn');
        if (contBtn) {
          if (rem > 0) { contBtn.style.display = ''; contBtn.textContent = '▶ Continue (' + rem + ' remaining)'; }
          else { contBtn.style.display = 'none'; }
        }
      }
    } else {
      a.classList.add('wrong'); b.classList.add('wrong');
      // Add to incorrect pile
      const pair = a.dataset.pair;
      const matchCard = fcCards.find((c,idx) => {
        const pool = document.querySelectorAll('.fc-match-card');
        return true;
      });
      // Find the actual card by matching pair index from current match pool
      const termEl = a.dataset.kind === 'term' ? a : b;
      const termText = termEl.textContent.trim();
      const card = fcCards.find(c => c.t === termText);
      if (card && !fcIncorrectPile.find(c => c.t === card.t && c.d === card.d)) {
        fcIncorrectPile.push({...card});
        fcUpdateIncorrectBadge();
      }
      fcMatchSel = null;
    }
  } else {
    el.classList.add('sel');
    fcMatchSel = el;
  }
}

// ── MCQ MODE ───────────────────────────────────────────
let fcMCQQueue = [];
let fcMCQUsedCards = [];  // Track all cards used across rounds
let fcMatchPool = [];  // ← Track cards in current match game
let fcMCQRangeStart = 0;
let fcMCQRangeEnd = 0;

function fcShowMCQRangePicker() {
  const picker = document.getElementById('fc-mcq-range-picker');
  const active = document.getElementById('fc-mcq-active');
  if (picker) picker.style.display = '';
  if (active) active.style.display = 'none';
  const total = fcCards.length;
  const label = document.getElementById('fc-mcq-total-label');
  if (label) label.textContent = total + ' cards in this deck';
  const container = document.getElementById('fc-mcq-range-btns');
  if (!container) return;
  const chunkSize = 10;
  let html = '';
  // "All cards" button
  html += `<button class="fc-r-btn primary" onclick="fcStartMCQWithRange(0,${total})" style="width:100%;margin-bottom:6px;font-size:1.05rem;padding:12px">🃏 All ${total} cards</button>`;
  // Range buttons
  for (let i = 0; i < total; i += chunkSize) {
    const end = Math.min(i + chunkSize, total);
    const count = end - i;
    html += `<button class="fc-r-btn" onclick="fcStartMCQWithRange(${i},${end})" style="flex:1;min-width:120px;padding:10px 14px;font-size:1.02rem">
      <div style="font-weight:700">${i + 1} – ${end}</div>
      <div style="font-size:0.85rem;opacity:0.6;margin-top:2px">${count} cards</div>
    </button>`;
  }
  container.innerHTML = html;
}

function fcStartMCQWithRange(start, end) {
  fcMCQRangeStart = start;
  fcMCQRangeEnd = end;
  fcMCQIndex = 0; fcMCQScore = 0;
  fcMCQUsedCards = [];
  fcMCQQueue = shuffle(fcCards.slice(start, end));
  const picker = document.getElementById('fc-mcq-range-picker');
  const active = document.getElementById('fc-mcq-active');
  if (picker) picker.style.display = 'none';
  if (active) active.style.display = '';
  const res = document.getElementById('fc-mcq-result');
  const q = document.getElementById('fc-mcq-q');
  const opts = document.getElementById('fc-mcq-opts');
  const next = document.getElementById('fc-mcq-next');
  if (res) res.style.display = 'none';
  if (q) q.style.display = '';
  if (opts) opts.style.display = '';
  if (next) next.style.display = 'none';
  fcShowMCQ();
}

function fcStartMCQ(continueMode) {
  if (!continueMode) {
    fcShowMCQRangePicker();
  } else {
    fcStartMCQWithRange(fcMCQRangeStart, fcMCQRangeEnd);
  }
}

function fcShowMCQ() {
  const scoreEl = document.getElementById('fc-mcq-score');
  const qEl = document.getElementById('fc-mcq-q');
  const optsEl = document.getElementById('fc-mcq-opts');
  const nextEl = document.getElementById('fc-mcq-next');
  if (fcMCQIndex >= fcMCQQueue.length) { fcShowMCQResult(); return; }
  const card = fcMCQQueue[fcMCQIndex];
  const total = fcMCQQueue.length;
  if (scoreEl) scoreEl.textContent = (fcMCQIndex+1) + ' / ' + total + '  ·  Score: ' + fcMCQScore;
  // Show definition as the question; options are terms (so the term never appears in the question)
  if (qEl) qEl.textContent = card.d;
  // 4 options: correct term + 3 random wrong terms
  const wrong = shuffle(fcCards.filter(c=>c.t!==card.t)).slice(0,3);
  const opts = shuffle([card, ...wrong]);
  fcMCQAnswered = false;
  fcMCQAnsweredWrong = false;
  if (optsEl) optsEl.innerHTML = opts.map((o,i) =>
    `<button class="fc-mcq-opt" id="fcmcq-${i}" onclick="fcPickMCQ(this,'${esc(o.t).replace(/'/g,"\\'")}','${esc(card.t).replace(/'/g,"\\'")}','${esc(card.d).replace(/'/g,"\\'")}')">
      ${esc(o.t)}
    </button>`
  ).join('');
  if (nextEl) nextEl.style.display = 'none';
}

function fcPickMCQ(el, chosen, correct, correctDef) {
  if (el.classList.contains('wrong') || el.classList.contains('correct')) return;
  const isCorrect = (chosen === correct);
  const card = fcMCQQueue[fcMCQIndex];
  if (isCorrect) {
    el.classList.add('correct');
    document.querySelectorAll('.fc-mcq-opt').forEach(o => { if (o !== el) o.classList.add('disabled'); });
    if (!fcMCQAnsweredWrong) fcMCQScore++;
    const next = document.getElementById('fc-mcq-next');
    if (next) { next.style.display = 'inline-block'; next.textContent = fcMCQIndex+1 >= fcMCQQueue.length ? 'See results →' : 'Next →'; }
  } else {
    el.classList.add('wrong');
    el.classList.add('disabled');
    fcMCQAnsweredWrong = true;
    if (!fcIncorrectPile.find(c => c.t === card.t && c.d === card.d)) {
      fcIncorrectPile.push({...card});
    }
    fcUpdateIncorrectBadge();
  }
}

function fcMCQNext() {
  fcMCQIndex++;
  fcShowMCQ();
}

function fcShowMCQResult() {
  const res = document.getElementById('fc-mcq-result');
  const q = document.getElementById('fc-mcq-q');
  const opts = document.getElementById('fc-mcq-opts');
  const title = document.getElementById('fc-mcq-final-title');
  const got = document.getElementById('fc-mcq-r-got');
  const miss = document.getElementById('fc-mcq-r-miss');
  const score = document.getElementById('fc-mcq-score');
  const next = document.getElementById('fc-mcq-next');
  const total = fcMCQQueue.length;
  if (q) q.style.display = 'none';
  if (opts) opts.style.display = 'none';
  if (next) next.style.display = 'none';
  if (res) res.style.display = 'block';
  const pct = Math.round(fcMCQScore/total*100);
  if (title) title.textContent = pct >= 80 ? '🎉 ' + pct + '% — Excellent!' : pct >= 60 ? '📈 ' + pct + '% — Good job!' : '📚 ' + pct + '% — Keep studying!';
  if (got) got.textContent = fcMCQScore;
  if (miss) miss.textContent = total - fcMCQScore;
  if (score) score.textContent = 'Cards ' + (fcMCQRangeStart+1) + '–' + fcMCQRangeEnd + '  ·  ' + pct + '%';
}

// ── INCORRECT PILE MANAGEMENT ───────────────────────────────────────────
function fcUpdateIncorrectBadge() {
  const badge = document.getElementById('fc-pile-badge');
  const btn = document.getElementById('fcbtn-incorrect');
  const count = fcIncorrectPile.length;
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'inline-block' : 'none';
  }
  if (btn) btn.style.opacity = count > 0 ? '1' : '0.5';
}

function fcRenderIncorrectPile() {
  const list = document.getElementById('fc-incorrect-list');
  const countEl = document.getElementById('fc-incorrect-count');
  const manageBtn = document.getElementById('fc-incorrect-manage-btn');
  
  if (!list) return;
  
  if (countEl) countEl.textContent = fcIncorrectPile.length;
  if (manageBtn) manageBtn.style.display = fcIncorrectPile.length > 0 ? 'inline-block' : 'none';
  
  if (fcIncorrectPile.length === 0) {
    list.innerHTML = '<div style="color:#888;font-size:1.06rem;text-align:center;padding:20px;background:#f9f9f7;border-radius:10px;border:1px solid #e8e7e0">No cards in incorrect pile yet. Cards you get wrong in Match or MCQ will appear here.</div>';
  } else {
    list.innerHTML = fcIncorrectPile.map((card, idx) => `
      <div style="background:#fff;border:1px solid #e8e7e0;border-radius:9px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;color:#1a1828;font-size:1.06rem;margin-bottom:4px">${esc(card.t)}</div>
          <div style="font-size:1.0rem;color:#555;line-height:1.5">${esc(card.d)}</div>
        </div>
        <button class="fc-r-btn" style="flex-shrink:0;padding:6px 10px;font-size:1.0rem" onclick="fcRemoveFromIncorrect(${idx})">✕</button>
      </div>
    `).join('');
  }
}

function fcRemoveFromIncorrect(idx) {
  fcIncorrectPile.splice(idx, 1);
  fcUpdateIncorrectBadge();
  fcRenderIncorrectPile();
}

function fcShowIncorrectRemoveMenu() {
  const menu = document.createElement('div');
  menu.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1.5px solid #d0cfd6;border-radius:12px;padding:20px;z-index:1000;box-shadow:0 20px 60px rgba(0,0,0,0.15);max-width:340px';
  
  menu.innerHTML = `
    <div style="font-size:1.15rem;font-weight:700;color:#1a1828;margin-bottom:14px">Manage Incorrect Pile</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
      <button class="fc-r-btn" style="text-align:left;padding:10px 14px;background:#fff1ee;border-color:#fecaca;color:#991b1b;font-size:1.06rem" onclick="fcRemoveIncorrectWhere('first');document.body.removeChild(this.closest('div'))" title="Remove the first card you added">🗑 Remove first card</button>
      <button class="fc-r-btn" style="text-align:left;padding:10px 14px;background:#fff1ee;border-color:#fecaca;color:#991b1b;font-size:1.06rem" onclick="fcRemoveIncorrectWhere('last');document.body.removeChild(this.closest('div'))" title="Remove the most recent card">🗑 Remove last card</button>
      <button class="fc-r-btn" style="text-align:left;padding:10px 14px;background:#fee2e2;border-color:#fca5a5;color:#7f1d1d;font-size:1.06rem;font-weight:700" onclick="fcRemoveIncorrectWhere('all');document.body.removeChild(this.closest('div'))" title="Clear the entire pile">🗑 Clear all (${fcIncorrectPile.length} cards)</button>
    </div>
    <button class="fc-r-btn" style="width:100%;padding:9px 14px;font-size:1.06rem" onclick="document.body.removeChild(this.closest('div'))">Cancel</button>
  `;
  
  // Add backdrop
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:999';
  backdrop.onclick = () => { document.body.removeChild(backdrop); document.body.removeChild(menu); };
  
  document.body.appendChild(backdrop);
  document.body.appendChild(menu);
}

function fcRemoveIncorrectWhere(where) {
  if (where === 'first') {
    fcIncorrectPile.shift();
  } else if (where === 'last') {
    fcIncorrectPile.pop();
  } else if (where === 'all') {
    fcIncorrectPile = [];
  }
  fcUpdateIncorrectBadge();
  fcRenderIncorrectPile();
}

// keyboard shortcuts for learn mode
document.addEventListener('keydown', e => {
  if (currentView !== 'flashcards' || fcMode !== 'learn') return;
  if (document.getElementById('fc-result')?.style.display === 'block') return;
  if (e.code === 'Space') { e.preventDefault(); fcFlip(); }
  if (e.code === 'ArrowRight') fcMark(true);
  if (e.code === 'ArrowLeft') fcMark(false);
});


// ── INIT ───────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initFlashcards();
});
</script>
</body>
</html>
